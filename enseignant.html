AC.BASE = 100; AC.SPEED = 50; AC.STREAK = 10; AC.STREAKMAX = 5;
AC.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
AC.sleep = ms => new Promise(r => setTimeout(r, ms));
AC.rid = n => { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; const b = new Uint8Array(n); crypto.getRandomValues(b); b.forEach(x => s += a[x % a.length]); return s; };
AC.hash = () => { const o = {}; location.hash.replace(/^#/, '').split('&').forEach(p => { const i = p.indexOf('='); if (i > 0) o[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); }); return o; };
AC.fmtT = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

/* ---------------- Relais (ntfy) : états diffusés en morceaux ---------------- */
AC.CH = 1500;
AC.Relay = function (base, sid) {
  this.base = (base || AC.DEFAULT_RELAY).replace(/\/+$/, '');
  this.tH = 'ac' + sid + 'h'; this.tP = 'ac' + sid + 'p'; this.tS = 'ac' + sid + 's';
};
AC.Relay.prototype.post = async function (topic, obj) {
  const body = JSON.stringify(obj);
  for (let i = 0; i < 5; i++) {
    try { const r = await fetch(this.base + '/' + topic, {method:'POST', body}); if (r.ok) return true; if (r.status === 429) await AC.sleep(4000); }
    catch (e) { /* réseau */ }
    await AC.sleep(500 * (i + 1));
  }
  return false;
};
AC.Relay.prototype.sub = function (topic, since, onmsg, onstatus) {
  let last = since, es = null, dead = false;
  const open = () => {
    if (dead) return;
    es = new EventSource(this.base + '/' + topic + '/sse?since=' + encodeURIComponent(last));
    es.onopen = () => onstatus && onstatus('ok');
    es.onerror = () => { onstatus && onstatus('retry'); try { es.close(); } catch (e) {} setTimeout(open, 2500); };

      if (m.event && m.event !== 'message') return;
      if (m.id) last = m.id;
      let o; try { o = JSON.parse(m.message); } catch (x) { return; }
      onmsg(o, m);
    };
  };
  open();
  return () => { dead = true; try { es.close(); } catch (e) {} };
};
AC.Relay.prototype.pubState = function (st) {
  const s = JSON.stringify(st), n = Math.ceil(s.length / AC.CH);
  this._pending = {v: st.v, s, n};
  if (this._busy) return;
  this._busy = true;
  (async () => {
    while (this._pending) {
      const p = this._pending; this._pending = null;
      let ok = true;
      for (let i = 0; i < p.n && ok; i++) ok = await this.post(this.tH, {v: p.v, i, n: p.n, d: p.s.slice(i * AC.CH, (i + 1) * AC.CH)});
      this.lastOk = ok;
    }
    this._busy = false;
  })();
};
AC.Assembler = function (cb) {
  const parts = {}; let cur = -1;
  return o => {
    if (o == null || o.v == null || o.v < cur) return;
    const p = parts[o.v] || (parts[o.v] = {n: o.n, a: []});
    p.a[o.i] = o.d;
    let ok = true; for (let i = 0; i < p.n; i++) if (p.a[i] == null) ok = false;

      cur = o.v;
      try { cb(JSON.parse(p.a.join(''))); } catch (e) { console.error(e); }
      Object.keys(parts).forEach(k => { if (+k < cur) delete parts[k]; });
    }
  };
};

        var b2 = read();

      var bytes = [];

        if (c < 128) {

    <p class="muted">Relais temps réel :</p><input id="rl" value="${AC.esc(AC.DEFAULT_RELAY)}" style="width:100%;padding:8px;background:#050A14;color:#E8F1FF;border:1px solid #1F3556;border-radius:8px">
    <p><button class="btn go" onclick="window.startNew()">Créer la séance</button></p></div></div>`;
}
window.resume = t => { const s = t === 'de test' ? ui.resumeT : ui.resume; ui.resume = ui.resumeT = null; resumeGame(s); };
window.startNew = () => { newGame($('ntest').checked, $('rl').value.trim() || AC.DEFAULT_RELAY); };

function header() {
  const n = nPl(), tabs = [['pilot', 'Pilotage'], ['quest', 'Questions'], ['rank', 'Classement'], ['corr', 'Corrigés'], ['guide', 'Guide']];
  return `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px">
   <div><h1 style="margin:0">LAN Live ${G.test ? '<span class="pill test">MODE TEST</span>' : '<span class="pill live">SÉANCE RÉELLE</span>'}</h1><span class="muted">${AC.PORTS(12)} ${AC.esc(relayStatus)}</span></div>
   <div style="text-align:right"><div class="muted">Code de séance (macro PowerPoint)</div><b class="mono" style="font-size:1.5em;color:#29D3FF;cursor:pointer" title="Copier" onclick="copyTxt('${G.sid}')">${G.sid}</b><div><b>${n}</b> joueur${n > 1 ? 's' : ''} connecté${n > 1 ? 's' : ''}</div></div></div>
   <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${tabs.map(t => `<button class="btn ${tab === t[0] ? '' : 'alt'} sm" onclick="window.setTab('${t[0]}')">${t[1]}</button>`).join('')}
   <span style="flex:1"></span><button class="btn alt sm" onclick="window.open(projUrl(),'_blank')">Ouvrir le classement projeté ↗</button><button class="btn alt sm" onclick="window.exportCSV()">Exporter CSV</button></div>`;
}
window.setTab = t => { tab = t; render(true); };
window.exportCSV = exportCSV;
function render(force) {
  if (!G) return;
  const ae = document.activeElement; if (!force && ae && ae.closest && ae.closest('#app') && /INPUT|SELECT|TEXTAREA/.test(ae.tagName)) return;
  const body = tab === 'pilot' ? pilotTab() : tab === 'quest' ? questTab() : tab === 'rank' ? rankTab() : tab === 'corr' ? corrTab() : guideTab();
  $('app').innerHTML = `<div class="wrap">${header()}${G.test ? testBar() : ''}${body}<div class="foot">${AC.FOOT}</div></div>`;
}
function testBar() {
  const c = G.cur;
  return `<div class="card" style="border-color:#FFB020"><h2 style="color:#FFB020">Mode test</h2><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
   <button class="btn alt sm" onclick="window.addBots(6)">+ 6 joueurs fictifs</button>
   <button class="btn alt sm" onclick="window.botAnswers()" ${c && c.st === 'open' ? '' : 'disabled'}>Faire répondre les fictifs</button>
   <button class="btn alt sm" onclick="window.resetPoints()">Remettre à zéro</button>
   <select id="gsel" style="background:#050A14;color:#E8F1FF;border:1px solid #1F3556;border-radius:8px;padding:5px">${AC.PUB.groups.map(g => `<option value="${g.id}">Diapo ${g.slide} · ${AC.esc(g.titre)}</option>`).join('')}</select>
   <button class="btn alt sm" onclick="window.goto($('gsel').value)">Aller à ce groupe</button>
   <button class="btn red sm" onclick="window.goReal()">Quitter le mode test → séance réelle</button></div></div>`;
}
window.addBots = addBots; window.botAnswers = botAnswers; window.resetPoints = resetPoints; window.goReal = goReal;
window.goto = gid => launch(gid, 0);

function pilotTab() {
  const c = G.cur, s = stepInfo(), q = curQ();
  let h = '';
  if (!Object.keys(G.played).length && !G.ended) h += startGuide();
  if (G.pend && !G.ended) { const g = grpOf(G.pend.gid); h += `<div class="card" style="border-color:#29D3FF;background:#0d2a44"><h2>Diapo ${g.slide} à l’écran</h2><p><b>${AC.esc(g.titre)}</b> · ${g.qs.length} question${g.qs.length > 1 ? 's' : ''}</p><button class="btn go" onclick="window.launchG('${g.id}')">▶ Lancer ces questions</button> <button class="btn alt" onclick="window.dismiss()">Ignorer</button></div>`; }
  if (ui.note) h += `<div class="card"><span class="muted">${AC.esc(ui.note)}</span></div>`;
  h += `<div class="card"><button class="btn xl ${s.ready ? 'go' : 'alt'}" ${s.act ? '' : 'disabled'} onclick="window.primary()">${AC.esc(s.label)}</button><p class="muted" style="margin:6px 0 0">${AC.esc(s.why)} · raccourci : touche <b>Espace</b>
   · <label><input type="checkbox" ${G.autoRev ? 'checked' : ''} onchange="window.setAutoRev(this.checked)"> corriger automatiquement dès la clôture</label></p></div>`;
  if (c && q) {
    const g = grpOf(c.gid), rep = SEC.q[c.qid][0], cnt = [0, 0, 0, 0]; Object.keys(c.ans).forEach(p => cnt[c.ans[p].a]++);
    const na = Object.keys(c.ans).length, waiting = Object.keys(G.pl).filter(p => !c.ans[p]).map(p => G.pl[p].n);
    const rem = c.st === 'open' ? c.dur - (now() - c.t0) / 1000 : 0;
    h += `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h2>Diapo ${g.slide} · ${AC.esc(g.titre)} · question ${c.i + 1}/${g.qs.length} ${q.final ? '<span class="pill test">POINTS ×2</span>' : ''}</h2>
     <div><span class="tag">${c.st === 'open' ? 'EN COURS' : c.st === 'closed' ? 'CLOSE' : 'CORRIGÉE'}</span> <b class="mono" style="font-size:1.4em" id="tm">${c.st === 'open' ? AC.fmtT(rem) : ''}</b></div></div>
     ${c.st === 'open' ? `<div class="cable"><div id="cb" style="width:${Math.max(0, 100 * rem / c.dur)}%"></div></div>` : ''}
     <p style="font-size:1.1em;margin:.6em 0"><b>${AC.esc(q.txt)}</b></p>${q.ctx ? `<pre class="ctx">${AC.esc(q.ctx)}</pre>` : ''}
     ${q.opts.map((o, i) => `<div class="opt" style="--oc:${AC.LCOL[i]};cursor:default;${i === rep ? 'border-color:#3DFF9A' : ''}"><span class="lt">${AC.LET[i]}</span><span style="flex:1">${AC.esc(o)} ${i === rep ? '<b class="ok">✔ bonne réponse</b>' : ''}</span><b class="mono">${cnt[i]}</b></div>`).join('')}
     <p class="muted"><b>${na} / ${nPl()}</b> réponses reçues${waiting.length && waiting.length <= 12 && c.st !== 'rev' ? ' · en attente : ' + waiting.map(AC.esc).join(', ') : ''}
     ${c.st === 'open' ? ` · <button class="btn alt sm" onclick="window.plus()">+15 s</button>` : ''}</p>
     ${c.st === 'rev' ? `<div class="card" style="background:#0a2a1e;border-color:#3DFF9A"><b>Explication envoyée aux joueurs :</b><br>${AC.esc(SEC.q[c.qid][1])}</div>` : ''}</div>`;
  }
  h += `<div class="card"><h2>Liaison avec le PowerPoint</h2><div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">
   <label>Mode : <select onchange="window.setAuto(this.value)" style="background:#050A14;color:#E8F1FF;border:1px solid #1F3556;border-radius:8px;padding:5px"><option value="direct" ${G.auto === 'direct' ? 'selected' : ''}>Automatique (lance dès que la diapo apparaît)</option><option value="confirm" ${G.auto === 'confirm' ? 'selected' : ''}>Avec confirmation</option><option value="manual" ${G.auto === 'manual' ? 'selected' : ''}>Manuel</option></select></label>
   <label>Je suis à la diapo n° <input id="sln" type="number" min="1" max="300" style="width:5em;background:#050A14;color:#E8F1FF;border:1px solid #1F3556;border-radius:8px;padding:5px" value="${AC.esc(ui.sl)}" onkeydown="if(event.key==='Enter')window.goSlide()"></label> <button class="btn alt sm" onclick="window.goSlide()">Aller</button>
   <span class="muted">${G.slideSeen ? '🟢 macro PowerPoint détectée' : '⚪ macro non détectée (normal sur Mac)'}${G.lastSlide && G.lastSlide.gid ? ' · dernière diapo : ' + (grpOf(G.lastSlide.gid) ? grpOf(G.lastSlide.gid).slide : '?') : ''}</span></div></div>`;
  const R = AC.rankList(G.pl).slice(0, 8);
  h += `<div class="card"><h2>Classement (top 8)</h2>${lbTable(R, '')}</div>`;
  h += `<div class="card"><button class="btn red sm" onclick="window.endSession()">Terminer la séance</button> <span class="muted">Affiche le podium final aux joueurs.</span></div>`;
  return h;
}
window.primary = doPrimary;
window.launchG = gid => launch(gid, 0);
window.dismiss = () => { G.pend = null; commit(false); };
window.setAuto = v => { G.auto = v; commit(false); };
window.setAutoRev = v => { G.autoRev = !!v; commit(false); };
window.plus = () => { if (G.cur && G.cur.st === 'open') { G.cur.dur += 15; commit(true); } };
window.goSlide = () => {
  const n = +($('sln').value); ui.sl = $('sln').value; const g = AC.PUB.groups.find(x => x.slide === n);
  if (!g) { ui.note = 'Aucune question liée à la diapo ' + n + '.'; render(true); return; }
  G.lastSlide = {n, gid:g.id, ts:now()};
  if (G.auto === 'manual') { launch(g.id, 0); return; }
  const free = !G.cur || G.cur.st === 'rev';
  if (G.auto === 'direct' && free) launch(g.id, 0); else { G.pend = {gid:g.id}; commit(false); }
};
window.endSession = () => { if (!confirm('Terminer la séance et afficher le podium final aux joueurs ?')) return; G.ended = true; G.cur = null; commit(true); };

function lbTable(R, meid) {
  if (!R.length) return '<p class="muted">Aucun joueur connecté.</p>';
  return `<table class="lb">${R.map((x, i) => `<tr class="${x.pid === meid ? 'me' : ''}"><td class="rk">${i + 1}</td><td>${AC.esc(x.n)}${G.test && x.bot ? ' <span class="tag">fictif</span>' : ''}</td><td class="muted">${x.ok} ✔ · ${AC.ms(x.tt)}</td><td class="pts">${x.pts}</td></tr>`).join('')}</table>`;
}
function startGuide() {
  const u = joinUrl();
  return `<div class="card" style="border-color:#3DFF9A"><h2>Mise en route : 4 étapes</h2>
   <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start"><div style="width:190px;background:#fff;padding:8px;border-radius:10px">${qrSvg(u, 180)}</div>
   <ol style="flex:1;min-width:260px;margin:0;padding-left:1.2em">
    <li><b>Faites entrer les étudiants</b> : ils scannent ce QR code ou tapent l’adresse <span class="mono" style="color:#29D3FF;word-break:break-all">${AC.esc(u)}</span> <button class="btn alt sm" onclick="copyTxt('${AC.esc(u)}')">Copier</button>, puis saisissent un pseudo. <b>${nPl()}</b> connecté${nPl() > 1 ? 's' : ''} (30 maximum recommandé).</li>
    <li><b>Projetez votre PowerPoint</b> en diaporama sur le vidéoprojecteur ; gardez cette tour de contrôle sur l’écran de votre PC.</li>
    <li><b>Liez les diapos aux questions</b> : sous Windows, lancez le diaporama avec la macro (elle demande le code <b class="mono">${G.sid}</b>) ; sinon tapez le numéro de diapo ci-dessous, ou utilisez le bouton vert. Détail dans l’onglet Guide.</li>
    <li><b>Optionnel</b> : ouvrez « le classement projeté » dans une seconde fenêtre pour l’afficher entre deux exercices.</li></ol></div></div>`;
}
function questTab() {
  let h = `<p class="muted">Toutes les questions, dans l’ordre du cours. ✔ = déjà jouée. Lancer un groupe l’envoie immédiatement aux joueurs.</p>`;
  let chap = '';
  AC.PUB.groups.forEach(g => {
    if (g.chap !== chap) { chap = g.chap; h += `<h2 style="margin-top:14px;color:#29D3FF">${AC.esc(chap)}</h2>`; }
    const open = ui.open[g.id], done = G.played[g.id];
    h += `<div class="card" style="padding:10px 14px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="tag">diapo ${g.slide}</span><b style="flex:1;min-width:200px">${done ? '✔ ' : ''}${AC.esc(g.titre)}</b><span class="muted">${g.qs.length} question${g.qs.length > 1 ? 's' : ''}</span>
     <button class="btn sm ${done ? 'alt' : 'go'}" onclick="window.launchGC('${g.id}')">${done ? '↻ Relancer' : '▶ Lancer'}</button><button class="btn alt sm" onclick="window.toggle('${g.id}')">${open ? '▲' : '▼'}</button></div>
     ${open ? g.qs.map((qid, i) => { const q = AC.q(qid); return `<div style="margin:6px 0 0 4px;display:flex;gap:8px;align-items:center"><span class="tag">${i + 1}</span><span style="flex:1">${AC.esc(q.txt)}</span>${G.qdone[qid] ? '<span class="ok">✔</span>' : ''}<button class="btn alt sm" onclick="window.launchQ('${g.id}',${i})">▶</button></div>`; }).join('') : ''}</div>`;
  });
  return h;
}
window.toggle = id => { ui.open[id] = !ui.open[id]; render(true); };
function confirmFree() { return !G.cur || G.cur.st === 'rev' || confirm('Une question est en cours. La remplacer ?'); }
window.launchGC = gid => { if (confirmFree()) launch(gid, 0); };
window.launchQ = (gid, i) => { if (confirmFree()) launch(gid, i); };
function rankTab() {
  const R = AC.rankList(G.pl);
  return `<div class="card"><h2>Classement complet</h2><p class="muted">Points, puis en cas d’égalité : le temps cumulé le plus court sur les bonnes réponses.</p>${lbTable(R, '')}</div>`;
}
function corrTab() {
  let h = `<p class="muted">Corrigés détaillés (visibles seulement ici, avec votre code). Bonne réponse en vert.</p>`, chap = '';
  AC.PUB.groups.forEach(g => {
    if (g.chap !== chap) { chap = g.chap; h += `<h2 style="margin-top:14px;color:#29D3FF">${AC.esc(chap)}</h2>`; }
    h += `<div class="card"><b>Diapo ${g.slide} · ${AC.esc(g.titre)}</b>` + g.qs.map(qid => { const q = AC.q(qid), s = SEC.q[qid];
      return `<div style="margin:10px 0;padding-top:8px;border-top:1px solid #1F3556"><b>${AC.esc(q.txt)}</b> <span class="tag">${qid} · ${q.t} s${q.final ? ' · ×2' : ''}</span>${q.ctx ? `<pre class="ctx">${AC.esc(q.ctx)}</pre>` : ''}
       ${q.opts.map((o, i) => `<div style="margin:2px 0;${i === s[0] ? 'color:#3DFF9A;font-weight:700' : 'color:#C9D8F2'}">${AC.LET[i]}. ${AC.esc(o)}${i === s[0] ? ' ✔' : ''}</div>`).join('')}<p class="muted">${AC.esc(s[1])}</p></div>`; }).join('') + '</div>';
  });
  return h;
}
function guideTab() {
  return `<div class="card"><h2>Avant la séance</h2><ol><li>Ouvrez cette tour de contrôle sur <b>votre PC personnel</b>, saisissez votre code, <b>créez la séance</b> (le mode test est coché par défaut : décochez-le le jour J).</li>
   <li>Faites entrer les étudiants (QR code ou adresse). 30 joueurs maximum.</li><li>Ouvrez le PowerPoint en diaporama.</li></ol></div>
   <div class="card"><h2>Lier le PowerPoint (Windows, une seule fois)</h2><ol>
   <li>Ouvrez <b>le PowerPoint étiqueté</b> fourni avec l’application. Appuyez sur Alt+F11, menu Fichier, Importer un fichier, choisissez <b>LANLive_macro.bas</b>, puis fermez la fenêtre.</li>
   <li>Enregistrez sous le type « Présentation PowerPoint avec macros (.pptm) ».</li>
   <li>Pour lancer le diaporama : Alt+F8, choisissez <b>LancerLANLive</b>, Exécuter. La macro demande le <b>code de séance</b> (affiché en haut à droite de la tour de contrôle).</li>
   <li>Ensuite, chaque fois que vous arrivez sur une diapo qui porte une question, la tour de contrôle la reçoit et, en mode automatique, la lance.</li></ol>
   <p class="muted">Sous Mac, ou si les macros sont bloquées : tapez le numéro de diapo dans « Je suis à la diapo n° » puis Entrée, ou utilisez le grand bouton vert (touche Espace).</p></div>
   <div class="card"><h2>Pendant la séance</h2><ul><li>Le grand bouton vert enchaîne : clore, corriger, question suivante.</li>
   <li>Points : ${AC.BASE} par bonne réponse + jusqu’à ${AC.SPEED} de bonus de rapidité + ${AC.STREAK} par bonne réponse consécutive (jusqu’à ${AC.STREAKMAX}) ; la question finale vaut le double. À égalité : le temps cumulé le plus court départage.</li>
   <li>Le chrono est propre à chaque question ; « +15 s » le prolonge ; la question se clôt aussi quand tous ont répondu.</li>
   <li>Une diapo déjà jouée ne relance pas la question si vous revenez en arrière : utilisez « Relancer » dans l’onglet Questions.</li>
   <li>Terminez par « Terminer la séance » (podium) puis « Exporter CSV » : deux fichiers (classement et détail).</li></ul></div>
   <div class="card"><h2>En cas de problème</h2><ul><li>Rechargez la page : la séance reprend sur ce PC (le code enseignant est redemandé).</li><li>Un étudiant qui se déconnecte revient par le même lien : il retrouve son score.</li>
   <li>Le relais public ntfy.sh limite le débit : si 30 étudiants se connectent derrière la même adresse Wi-Fi, l’affichage peut avoir quelques secondes de retard.</li></ul></div>`;
}
</script></body></html>
