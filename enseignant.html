'use strict';
const AC = {};
AC.DEFAULT_RELAY = 'https://ntfy.sh';
AC.LET = ['A', 'B', 'C', 'D'];
AC.LCOL = ['#3B82F6', '#F0E442', '#E8710A', '#D946EF'];   // A à D : couleurs de VLAN 10, 20, 30, 40
AC.VLAN = [10, 20, 30, 40];
AC.BASE = 100; AC.SPEED = 50; AC.STREAK = 10; AC.STREAKMAX = 5;
AC.LATE = 0.5; AC.GRACE = 1500;   // réponse tardive (après le chrono) : moitié des points de base, sans bonus ; tolérance de 1,5 s pour le réseau
AC.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
AC.sleep = ms => new Promise(r => setTimeout(r, ms));
AC.rid = n => { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; const b = new Uint8Array(n); crypto.getRandomValues(b); b.forEach(x => s += a[x % a.length]); return s; };
AC.hash = () => { const o = {}; location.hash.replace(/^#/, '').split('&').forEach(p => { const i = p.indexOf('='); if (i > 0) o[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); }); return o; };
AC.fmtT = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
AC.ms = ms => (ms / 1000).toFixed(1).replace('.', ',') + ' s';
AC.q = id => AC.PUB.qs[id];
AC.num = id => +String(id).slice(1);   // numéro de la question = numéro dans le PowerPoint
AC.norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
AC.CLOUDPT = 50;   // points par mot attendu trouvé (nuage de mots)
AC.grp = id => AC.PUB.groups.find(g => g.id === id);
AC.rankList = pl => Object.keys(pl).map(p => Object.assign({pid:p}, pl[p])).sort((a, b) => (b.pts - a.pts) || (a.tt - b.tt) || a.n.localeCompare(b.n, 'fr'));

/* ---------------- Relais (ntfy) : états diffusés en morceaux ---------------- */
AC.CH = 1500; AC.CHW = 50000;
AC.DEFAULT_WS = 'wss://cpro-relay.belmdeveloppement.workers.dev/ps';   // relais Cloudflare (WebSocket, port 443) ; ntfy reste le repli
AC.Relay = function (base, sid, ws) {
  this.base = (base || AC.DEFAULT_RELAY).replace(/\/+$/, '');
  this.tH = 'ac' + sid + 'h'; this.tP = 'ac' + sid + 'p'; this.tS = 'ac' + sid + 's';
  this.room = sid;
  const h = AC.hash(); this.wsBase = h.ws === '0' ? '' : (h.ws || (ws === undefined ? AC.DEFAULT_WS : ws));
  this._subs = {}; this._acks = {}; this._seen = new Set(); this._ws = null; this._wsUp = false; this._fails = 0; this._dead = false;
};
AC.Relay.prototype.useWs = function (topic) { return !!this.wsBase && (topic === this.tH || topic === this.tP || topic === this.tS); };
AC.Relay.prototype.wsUp = function () { return this._wsUp; };
AC.Relay.prototype._statusAll = function () { Object.keys(this._subs).forEach(t => this._subs[t].upd && this._subs[t].upd()); };
AC.Relay.prototype._wsOpen = function () {
  if (!this.wsBase || this._ws || this._dead) return;
  let w; try { w = new WebSocket(this.wsBase + (this.wsBase.indexOf('?') > 0 ? '&' : '?') + 'room=' + encodeURIComponent(this.room)); }
  catch (e) { this._wsRetry(); return; }
  this._ws = w; let ping = null, closed = false;
  w.onopen = () => {
    this._wsUp = true; this._fails = 0;
    Object.keys(this._subs).forEach(t => { if (this._subs[t].ws) w.send(JSON.stringify({a: 'sub', t, since: this._subs[t].last})); });
    ping = setInterval(() => { try { w.send('ping'); } catch (e) {} }, 25000);
    this._statusAll();
  };
  w.onmessage = e => {
    if (e.data === 'pong') return;
    let m; try { m = JSON.parse(e.data); } catch (x) { return; }
    if (m.a === 'ack') { const k = this._acks[m.u]; if (k) { clearTimeout(k.t); delete this._acks[m.u]; if (m.n === 0 && k.fb) k.fb(); } return; }
    if (m.a !== 'msg') return;
    const s = this._subs[m.t]; if (!s) return;
    s.last = m.id;
    let o; try { o = JSON.parse(m.m); } catch (x) { return; }
    s.cb(o, m.t === this.tS && m.ts ? {time: m.ts / 1000, ws: true} : undefined);   // sujet diapos : horodatage serveur (pour ignorer les diapos d'avant l'ouverture)
  };
  const end = () => {
    if (closed) return; closed = true; clearInterval(ping);
    this._ws = null; this._wsUp = false; this._fails++; this._statusAll(); this._wsRetry();
  };
  w.onclose = end; w.onerror = end;
};
AC.Relay.prototype._wsRetry = function () { if (this._dead) return; setTimeout(() => this._wsOpen(), Math.min(15000, 1000 * Math.pow(2, Math.min(this._fails, 4)))); };
AC.Relay.prototype._wsSend = function (o) { try { this._ws.send(JSON.stringify(o)); return true; } catch (e) { return false; } };
AC.Relay.prototype._ntfy = async function (topic, body) {
  for (let i = 0; i < 5; i++) {
    try { const r = await fetch(this.base + '/' + topic, {method: 'POST', body}); if (r.ok) return true; if (r.status === 429) await AC.sleep(4000); }
    catch (e) { /* réseau */ }
    await AC.sleep(500 * (i + 1));
  }
  return false;
};
/* post : par WebSocket si disponible (avec repli sur ntfy si personne n'écoute ou pas d'accusé), sinon par ntfy */
AC.Relay.prototype.post = async function (topic, obj) {
  obj = Object.assign({_u: AC.rid(10)}, obj);
  const body = JSON.stringify(obj);
  if (this.useWs(topic) && this._wsUp) {
    const fb = () => this._ntfy(topic, body);
    const t = setTimeout(() => { delete this._acks[obj._u]; fb(); }, 2500);
    this._acks[obj._u] = {t, fb};
    if (this._wsSend({a: 'pub', t: topic, m: body, u: obj._u})) return true;
    clearTimeout(t); delete this._acks[obj._u];
  }
  return this._ntfy(topic, body);
};
AC.Relay.prototype.sub = function (topic, since, onmsg, onstatus) {
  let last = since, es = null, dead = false, esOk = false;
  const seen = this._seen;
  const deliver = (o, m) => {
    if (o && o._u) { if (seen.has(o._u)) return; seen.add(o._u); if (seen.size > 20000) seen.clear(); }
    onmsg(o, m);
  };
  const upd = () => onstatus && onstatus(esOk || this._wsUp ? 'ok' : 'retry');
  const open = () => {
    if (dead) return;
    es = new EventSource(this.base + '/' + topic + '/sse?since=' + encodeURIComponent(last));
    es.onopen = () => { esOk = true; upd(); };
    es.onerror = () => { esOk = false; upd(); try { es.close(); } catch (e) {} setTimeout(open, this._wsUp ? 15000 : 2500); };
    es.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.event && m.event !== 'message') return;
      if (m.id) last = m.id;
      let o; try { o = JSON.parse(m.message); } catch (x) { return; }
      deliver(o, m);
    };
  };
  open();
  if (this.useWs(topic)) {
    this._subs[topic] = {last: 0, cb: (o, mm) => deliver(o, mm), ws: true, upd};
    if (this._wsUp) this._wsSend({a: 'sub', t: topic, since: 0}); else this._wsOpen();
  }
  return () => { dead = true; try { es.close(); } catch (e) {} delete this._subs[topic]; };
};
AC.Relay.prototype.pubState = function (st) {
  const s = JSON.stringify(st), n = Math.ceil(s.length / AC.CH);
  const ntfyGo = () => {               // copie sur ntfy (repli) : seulement si le relais ne suffit pas, pour ménager le quota de ntfy.sh
    this._pending = {v: st.v, s, n};
    if (this._busy) return;
    this._busy = true;
    (async () => {
      while (this._pending) {
        const p = this._pending; this._pending = null;
        let ok = true;
        for (let i = 0; i < p.n && ok; i++) ok = await this._ntfy(this.tH, JSON.stringify({_u: AC.rid(10), v: p.v, i, n: p.n, d: p.s.slice(i * AC.CH, (i + 1) * AC.CH)}));
        this.lastOk = ok;
      }
      this._busy = false;
    })();
  };
  if (this.wsBase && this._wsUp) {     // WebSocket : état complet en un ou quelques gros messages, immédiat
    const k = Math.ceil(s.length / AC.CHW);
    let sent = true;
    for (let i = 0; i < k; i++) {
      const u = AC.rid(10);
      if (i === 0) {                   // accusé du relais : si aucun abonné (n=0) ou pas de réponse en 2,5 s, on recopie sur ntfy
        const t = setTimeout(() => { delete this._acks[u]; ntfyGo(); }, 2500);
        this._acks[u] = {t, fb: ntfyGo};
      }
      if (!this._wsSend({a: 'pub', t: this.tH, m: JSON.stringify({_u: AC.rid(10), v: st.v, i, n: k, d: s.slice(i * AC.CHW, (i + 1) * AC.CHW)}), u: i === 0 ? u : undefined})) sent = false;
    }
    if (sent && AC.hash().ntfy !== '1') return;     // ajouter « &ntfy=1 » au lien de la tour pour toujours doubler sur ntfy
  }
  ntfyGo();
};
AC.Assembler = function (cb) {
  const parts = {}; let cur = -1;
  return o => {
    if (o == null || o.v == null || o.v < cur) return;
    const key = o.v + '/' + o.n, p = parts[key] || (parts[key] = {n: o.n, a: []});
    p.a[o.i] = o.d;
    let ok = true; for (let i = 0; i < p.n; i++) if (p.a[i] == null) ok = false;
    if (ok && o.v > cur) {
      cur = o.v;
      try { cb(JSON.parse(p.a.join(''))); } catch (e) { console.error(e); }
      Object.keys(parts).forEach(k => { if (parseInt(k, 10) < cur) delete parts[k]; });
    }
  };
};

AC.encFor = async (pkJwk, obj) => {
  const pk = await crypto.subtle.importKey('jwk', pkJwk, {name:'ECDH', namedCurve:'P-256'}, false, []);
  const kp = await crypto.subtle.generateKey({name:'ECDH', namedCurve:'P-256'}, true, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({name:'ECDH', public:pk}, kp.privateKey, {name:'AES-GCM', length:256}, false, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, k, new TextEncoder().encode(JSON.stringify(obj))));
  return {e:await crypto.subtle.exportKey('jwk', kp.publicKey), iv:AC.b64(iv), c:AC.b64(ct)};
};
AC.decWith = async (skJwk, d) => {
  const sk = await crypto.subtle.importKey('jwk', skJwk, {name:'ECDH', namedCurve:'P-256'}, false, ['deriveKey']);
  const ep = await crypto.subtle.importKey('jwk', d.e, {name:'ECDH', namedCurve:'P-256'}, false, []);
  const k = await crypto.subtle.deriveKey({name:'ECDH', public:ep}, sk, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:AC.unb64(d.iv)}, k, AC.unb64(d.c))));
};

CL :","Complexité : Dans les grands systèmes, la gestion des ACL peut devenir complexe et difficile à maintenir.","Performance : L'évaluation des ACL peut ajouter une surcharge de performance, surtout dans les systèmes très sollicités","● Rôle en cybersécurité : La granularité est un avantage de sécurité à condition de rester lisible : une règle oubliée est une faille silencieuse."]}},{"id":"G229","slide":34,"so":33,"titre":"Questions : Lire une ACL","chap":"ACL et modèles","qs":["Q010","Q011","Q012"],"rap":{"t":"Lire une ACL réseau","p":["Lisez l’ACL, puis répondez aux 3 Questions sur votre PC · LAN Live","1 permit tcp 192.168.10.0 0.0.0.255 host 192.168.20.10 eq 443","2 deny ip 192.168.30.0 0.0.0.255 192.168.20.0 0.0.0.255","3 permit tcp 192.168.40.0 0.0.0.255 host 192.168.20.10 eq 443","4 permit tcp any host 192.168.20.30 eq 25","(refus implicite : deny ip any any)","À faire","Pour chaque paquet a à f : ligne appliquée et décision (permit ou deny).","Que devient la protection si l'on ajoute « permit ip any any » en ligne 1 ?"],"tb":[[["Paquet","Source","Destination","Port"],["a","192.168.10.25","192.168.20.10","TCP 443"],["b","192.168.30.7","192.168.20.10","TCP 443"],["c","192.168.40.9","192.168.20.10","TCP 443"],["d","192.168.40.9","192.168.20.20","TCP 445"],["e","192.168.10.25","192.168.20.10","TCP 22"],["f","203.0.113.5","192.168.20.30","TCP 25"]]]}},{"id":"G16","slide":41,"so":40,"titre":"Lire une ACL réseau","chap":"ACL et modèles","qs":["Q013","Q014","Q015","Q016","Q017"],"rap":{"t":"Rappel · Lire une ACL réseau Cisco","p":["Rappel avant les questions","Sens de lecture","De haut en bas : la première ligne qui correspond s’applique, les suivantes ne sont pas lues. Fin de liste : refus implicite.","Masque générique (wildcard) = masque inverse","0 = bit à comparer · 255 = bit ignoré.","10.1.2.0 0.0.0.255 → tout le réseau 10.1.2.0/24","host 10.1.2.7 → 10.1.2.7 0.0.0.0 (une seule machine)","any → 0.0.0.0 255.255.255.255 (tout le monde)","Deux familles"]}},{"id":"G22","slide":55,"so":54,"titre":"Push ou Pull chez TransLor","chap":"ACL et modèles","qs":["Q018","Q019","Q020","Q021"],"rap":{"t":"Stratégies Push et Pull","p":["Contexte","Imaginons une entreprise qui utilise un système de gestion de documents pour stocker et partager des fichiers sensibles entre ses employés. L'entreprise souhaite assurer la sécurité des documents tout en permettant un accès flexible selon les besoins des utilisateurs.","Contrôle d'Accès","L'entreprise utilise des listes de contrôle d'accès (ACL) pour définir les permissions des utilisateurs sur les documents. Par exemple :","Alice (manager) a des permissions de lecture et d'écriture sur les documents du projet.","Bob (employé) a des permissions de lecture uniquement sur les mêmes documents.","● Rôle en cybersécurité : Le socle poussé doit rester minimal : tout ce qu'on donne à tous est lisible par un compte compromis."]}},{"id":"G28","slide":67,"so":66,"titre":"Push ou Pull : 8 phrases","chap":"ACL et modèles","qs":["Q022","Q023","Q024","Q025"],"rap":{"t":"Stratégies Push et Pull","p":["Résultat","Grâce à la combinaison des stratégies push et pull, l'entreprise peut :","Assurer une sécurité de base uniforme pour tous les utilisateurs.","Répondre de manière flexible aux besoins spécifiques des utilisateurs en matière d'accès.","Maintenir un haut niveau de sécurité et de conformité en déployant rapidement des mises à jour de sécurité.","Ce modèle permet de gérer efficacement les permissions et de garantir que les documents sensibles sont protégés tout en offrant la flexibilité nécessaire pour répondre aux besoins opérationnels.","● Rôle en cybersécurité : Un socle uniforme réduit les écarts de configuration, source d'une bonne part des incidents."]}},{"id":"G30","slide":76,"so":75,"titre":"VLAN : l’acronyme","chap":"VLAN","qs":["Q026"],"rap":{"t":"VLAN","p":["En clair :  Un VLAN, c’est un réseau découpé « virtuellement » sur les mêmes câbles et les mêmes switchs, comme des salles étanches dans un même bâtiment.","Un VLAN (Virtual Local Area Network, réseau local virtuel) est une technologie qui permet de segmenter un réseau physique en plusieurs réseaux logiques distincts.","Cela permet de regrouper des appareils en fonction de critères « administratifs », indépendamment de leur emplacement physique","● Rôle en cybersécurité : Un VLAN sépare les diffusions mais n'est pas un pare-feu : sans filtrage au routeur, les VLAN ne protègent qu'en apparence."]}},{"id":"G34","slide":83,"so":82,"titre":"Plan de VLAN de TransLor","chap":"VLAN","qs":["Q027","Q028","Q029"],"rap":{"t":"Rappel · Segmenter : tout est interdit par défaut","p":["Rappel avant les questions","Moindre privilège entre VLAN","Par défaut, rien ne passe d’un VLAN à l’autre. On n’ouvre que le flux nécessaire : source, destination, port.","VLAN de gestion","Les interfaces d’administration des switchs et des bornes sont placées dans un VLAN dédié (ex. 99), joignable seulement depuis les postes des administrateurs.","Réflexe de dimensionnement","Un réseau /24 offre 254 adresses utilisables (2⁸ − 2).","Exemple de flux ouvert","Gestionnaires → serveur de fichiers, en SMB (445) seulement."]}},{"id":"G40","slide":94,"so":93,"titre":"VLAN : compléter les trous","chap":"VLAN","qs":["Q030","Q031","Q032"],"rap":{"t":"VLAN : Pouvez-vous compléter les « trous » dans la phrase suivante ?","p":["Sur ce switch, le port 1 n’appartient que au VLAN 10 c’est un ------ . L’identifiant du VLAN est ce qu’on appelle un ------.","Pour que le port 5 du switch à droite transporte le trafic des deux VLANs je dois configurer le port 5 en ------"]}},{"id":"G43","slide":102,"so":101,"titre":"Question sur le VLAN tagging","chap":"VLAN","qs":["Q033"],"rap":{"t":"VLAN : quelques mots clés (suite)","p":["1. TCI (Tag Control Information) : Taille : 16 bits","PCP (Priority Code Point) : 3 bits Fonction : Indique la priorité de la trame (classe de service), utilisée pour la qualité de service (QoS).","DEI (Drop Eligible Indicator) : 1 bit Fonction : Indique si la trame peut être abandonnée en cas de congestion.","VID (VLAN Identifier) : 12 bits Fonction : Spécifie l'identifiant du VLAN, permettant jusqu'à 4094 VLANs (les valeurs 0 et 4095 sont réservées)","● Rôle en cybersécurité : Le champ de priorité peut être abusé : un attaquant qui marque son trafic en haute priorité dégrade les autres flux."]}},{"id":"G48","slide":107,"so":106,"titre":"Configuration d’un trunk","chap":"VLAN","qs":["Q034","Q035","Q036"],"rap":{"t":"VLAN : quelques mots clés (suite)","p":["Dans l’exemple ci-dessous, le port 24 du module 0 est configuré en port TRUNK sur les VLAN 10 et 20 et le VLAN 10 est le native VLAN","Switch> enable","Switch# configure terminal","Switch(config)# interface fa0/24","Switch(config-if)# switchport mode trunk","Switch(config-if)# switchport trunk native vlan 10","Switch(config-if)# switchport trunk allowed vlan 10,20","Switch(config-if)# exit","● Rôle en cybersécurité : La commande allowed vlan est une liste blanche : elle limite ce qu'un trunk compromis peut atteindre."]}},{"id":"G51","slide":115,"so":114,"titre":"VLAN hopping","chap":"VLAN","qs":["Q037","Q038"],"rap":{"t":"VLAN : quelques mots clés (suite)","p":["L'attaquant fabrique une trame spéciale avec deux tags imbriqués :","Tag Externe (VLAN 10 - Natif) : Ce tag sert de \"leurre\" pour le premier switch.","Tag Interne (VLAN 20 - Cible) : Ce tag est caché derrière le premier. C'est la destination réelle.","Le processus étape par étape :","Étape A (Switch 1) : Le switch reçoit la trame. Il voit le Tag 10. Comme le VLAN 10 est le VLAN natif sur son port Trunk, il suit sa règle par défaut : \"Je retire l'étiquette avant d'envoyer sur le Trunk\".","Étape B (Sur le câble) : La trame circule sur le lien Trunk. Elle n'a plus le tag 10, mais elle possède maintenant le Tag 20 qui était caché dessous.","Étape C (Switch 2) : Le switch reçoit la trame. Il voit le Tag 20. Il pense que c'est une trame légitime venant du Switch 1 et l'envoie directement aux machines du VLAN 20.","● Rôle en cybersécurité : Elle est neutralisée par un native VLAN dédié, inutilisé, et par la liste blanche des VLAN autorisés."]}},{"id":"G53","slide":121,"so":120,"titre":"Inter-VLAN","chap":"VLAN","qs":["Q039","Q040","Q041"],"rap":{"t":"Rappel · Routage inter-VLAN","p":["Rappel avant les questions","Un routeur relié au switch par un trunk porte une sous-interface par VLAN. Exemple pour un VLAN 30 :","interface Gi0/0.30","encapsulation dot1Q 30","ip address 192.168.30.1 255.255.255.0","Passerelle par défaut","L’adresse de la sous-interface est la passerelle des postes de ce VLAN.","Filtrer entre VLAN","Sans ACL sur le routeur, tous les VLAN peuvent se parler. L’ACL se pose sur la sous-interface, en entrée ou en sortie, et ne laisse passer que les flux voulus."]}},{"id":"G58","slide":131,"so":130,"titre":"VTP","chap":"VLAN","qs":["Q042","Q043"],"rap":{"t":"VLAN : quelques mots clés (suite)","p":["Le VTP utilise un Configuration Revision Number. Chaque fois que vous changez quelque chose sur le serveur, ce numéro augmente (1, 2, 3...). Lorsqu'un switch client voit passer un message avec un numéro de révision plus élevé que le sien, il se dit : \"Tiens, il y a du nouveau !\" et il met à jour sa base de données de VLANs.","● Rôle en cybersécurité : Un numéro de révision élevé écrase la base de tout le réseau : on le remet à zéro avant d'ajouter un switch."]}},{"id":"G231","slide":139,"so":138,"titre":"Questions : Boucle réseau sans STP","chap":"VLAN","qs":["Q044"],"rap":{"t":"VLAN : quelques mots clés","p":["■ Question · LAN Live · 1 Question suit  Deux switchs sont reliés par deux câbles pour la redondance. Un poste envoie une trame de diffusion (broadcast). Que peut-il se passer, et pourquoi ?","STP (Spanning Tree Protocol) : Protocole utilisé pour éviter les boucles dans un réseau de switches, essentiel pour les configurations VLAN complexes.","Le problème : La Boucle Réseau (Broadcast Storm)","En réseau, on veut de la redondance. On branche donc souvent deux câbles entre deux switchs (ou on fait un triangle entre trois switchs) pour que si un câble lâche, le réseau continue de fonctionner."]}},{"id":"G232","slide":144,"so":143,"titre":"Questions : Root Bridge","chap":"VLAN","qs":["Q045"],"rap":{"t":"VLAN : quelques mots clés (suite)","p":["■ Question · LAN Live · 1 Question suit  Trois switchs ont pour priorité : A = 8192, B = 24576, C = 32768. Lequel devient Root Bridge ? Et si A et B tombent en panne ?","Comment il procède (L'élection) :","Élection du Root Bridge (Le Chef) : Les switchs s'échangent des messages appelés BPDU. Le switch avec la priorité la plus basse devient le \"Root Bridge\".","Calcul du chemin le plus court : Chaque switch calcule le coût pour atteindre le chef.","Blocage des ports : Le STP laisse ouverts les chemins les plus rapides et bloque logiquement les ports qui créeraient une boucle.","● Rôle en cybersécurité : Laisser l'élection au hasard place le root là où l'on n'a pas choisi : on fixe les priorités à la main."]}},{"id":"G70","slide":150,"so":149,"titre":"Qui devient Root Bridge ?","chap":"VLAN","qs":["Q046","Q047","Q048"],"rap":{"t":"VLAN : quelques mots clés","p":["Broadcast Domain : Segment du réseau où les messages de diffusion (broadcast) sont reçus par tous les appareils. Chaque VLAN constitue un domaine de diffusion distinct.","Ceci permet de mieux gérer le trafic, de limiter les tempêtes de broadcast …","● Rôle en cybersécurité : Un domaine de diffusion plus petit, c'est moins de postes qui voient les annonces réseau."]}},{"id":"G74","slide":158,"so":157,"titre":"Questions : VLAN et STP","chap":"VLAN","qs":["Q049","Q050","Q051"],"rap":{"t":"VLAN : quelques mots clés (suite)","p":["En Ethernet, une trame de diffusion est envoyée à l'adresse MAC de destination universelle : ff:ff:ff:ff:ff:ff","Quand un switch reçoit cette trame, il la renvoie par tous ses ports (sauf celui d'origine).","La règle d'or : Un VLAN = Un domaine de diffusion = Un sous-réseau IP.","● Rôle en cybersécurité : Les diffusions sont envoyées en clair : toute machine du domaine peut les lire."]}},{"id":"G79","slide":168,"so":167,"titre":"Domaine de diffusion","chap":"VLAN","qs":["Q052","Q053"],"rap":{"t":"VLAN : quelques mots clés (suite)","p":["Confidentialité : En séparant les domaines (ex: VLAN Direction vs VLAN Stagiaires), on s'assure que les messages de découverte réseau des uns ne sont pas visibles par les autres.","● Rôle en cybersécurité : La confidentialité commence par la séparation : ce qu'on ne voit pas, on ne peut pas le cibler."]}},{"id":"G80","slide":172,"so":167,"titre":"VLAN · synthèse 1/4","chap":"VLAN","qs":["Q054"],"rap":{"t":"VLAN : quelques mots clés (suite)","p":["Confidentialité : En séparant les domaines (ex: VLAN Direction vs VLAN Stagiaires), on s'assure que les messages de découverte réseau des uns ne sont pas visibles par les autres.","● Rôle en cybersécurité : La confidentialité commence par la séparation : ce qu'on ne voit pas, on ne peut pas le cibler."]}},{"id":"G81","slide":174,"so":167,"titre":"VLAN · synthèse 2/4","chap":"VLAN","qs":["Q055"],"rap":{"t":"VLAN : quelques mots clés (suite)","p":["Confidentialité : En séparant les domaines (ex: VLAN Direction vs VLAN Stagiaires), on s'assure que les messages de découverte réseau des uns ne sont pas visibles par les autres.","● Rôle en cybersécurité : La confidentialité commence par la séparation : ce qu'on ne voit pas, on ne peut pas le cibler."]}},{"id":"G82","slide":176,"so":167,"titre":"VLAN · synthèse 3/4","chap":"VLAN","qs":["Q056"],"rap":{"t":"VLAN : quelques mots clés (suite)","p":["Confidentialité : En séparant les domaines (ex: VLAN Direction vs VLAN Stagiaires), on s'assure que les messages de découverte réseau des uns ne sont pas visibles par les autres.","● Rôle en cybersécurité : La confidentialité commence par la séparation : ce qu'on ne voit pas, on ne peut pas le cibler."]}},{"id":"G83","slide":178,"so":167,"titre":"VLAN · synthèse 4/4","chap":"VLAN","qs":["Q057"],"rap":{"t":"VLAN : quelques mots clés (suite)","p":["Confidentialité : En séparant les domaines (ex: VLAN Direction vs VLAN Stagiaires), on s'assure que les messages de découverte réseau des uns ne sont pas visibles par les autres.","● Rôle en cybersécurité : La confidentialité commence par la séparation : ce qu'on ne voit pas, on ne peut pas le cibler."]}},{"id":"GC053","slide":182,"so":181,"titre":"Filtrage MAC : cas d’usage","chap":"Filtrage MAC","qs":["Q058"],"rap":{"t":"Filtrage MAC : Historique et standardisation","p":["Notions Introduites avec Ethernet dans les années 1980.","Standardisées par l’IEEE (norme 802).","Attribuées par l’IEEE Registration Authority.","Certaines adresses peuvent être localement administrées (bit spécifique à 1 voir le schéma ci-dessous).","OUI","24 bits · constructeur (IEEE)","NIC","24 bits · numéro de série de la carte","3 premiers octets"]}},{"id":"G90","slide":186,"so":185,"titre":"Adresses MAC : combien ?","chap":"Filtrage MAC","qs":["Q059"],"rap":{"t":"Filtrage MAC","p":["Les adresses MAC sont uniques au monde. On peut aussi la désigner sous le nom d’adresse physique, adresse Ethernet","Elle se situe au niveau 2 (couche de liaison) du modèle OSI","Les adresses MAC sont attribuées par l’IEEE","Le format d’une adresse MAC, sur 48 bits est le suivant (schéma ci-dessous)","OUI","24 bits · constructeur (IEEE)","NIC","24 bits · numéro de série de la carte","3 premiers octets"]}},{"id":"G93","slide":190,"so":189,"titre":"Filtrage MAC : ses limites","chap":"Filtrage MAC","qs":["Q060","Q061"],"rap":{"t":"Filtrage MAC (suite)","p":["Configuration du routeur : Une fois les adresses MAC identifiées, elles sont entrées dans la section de filtrage MAC du routeur. Le routeur est alors configuré pour autoriser uniquement les appareils avec ces adresses MAC à accéder au réseau","Blocage des appareils non autorisés : Le routeur bloque l'accès au réseau pour tous les appareils dont l'adresse MAC n'est pas enregistrée. Cela empêche les appareils non autorisés de se connecter, même s'ils connaissent le mot de passe WiFi","● Rôle en cybersécurité : Une liste d'autorisation qu'on n'ose plus nettoyer finit par contenir des appareils qui n'existent plus."]}},{"id":"G94","slide":196,"so":195,"titre":"MAC 1 : votre adresse","chap":"Filtrage MAC","qs":["Q062"],"rap":{"t":"Commandes réseau Windows : ipconfig, arp, netstat, tracert, nslookup, netsh","p":["Six commandes de diagnostic","ipconfig /all : adresse IP, passerelle, DNS et adresse physique (MAC) de chaque carte réseau.","arp -a : table ARP locale, la correspondance entre adresses IP et adresses MAC (ARP = Address Resolution Protocol).","netstat -an : connexions en cours et ports en écoute.","tracert : chemin suivi par les paquets, saut par saut.","nslookup : interroge le DNS (Domain Name System) pour traduire un nom en adresse.","netsh : configure le réseau en ligne de commande (interfaces, pare-feu, Wi-Fi).","ipconfig /all","arp -a"]}},{"id":"G96","slide":198,"so":197,"titre":"MAC 2 : la table ARP","chap":"Filtrage MAC","qs":["Q063"],"rap":{"t":"Filtrage MAC · réponses 1","p":["1. Trouver l’adresse MAC de votre ordinateur","Sous l’invite de commande taper ipconfig/all","Vous obtenez plusieurs adresses MAC (celle de la carte réseau, du WIFI, ..)","2. identifier le constructeur","Copier une des adresses MAC","Aller sur le site macvendors.com","Recopier l’adresse MAC = en dessous apparaît le nom du fabricant","● Rôle en cybersécurité : Vérifier l'OUI de sa propre carte montre comment un attaquant identifie le fabricant d'un équipement qu'il observe."]}},{"id":"GC059","slide":200,"so":199,"titre":"Filtrage par annuaire : types d’annuaires","chap":"Filtrage MAC","qs":["Q064"],"rap":{"t":"Filtrage MAC · réponses 2","p":["1. Afficher le contenu d’une table ARP","1. On passe sous l’invite de commande","2. Il faut d’abord « réveiller » la cible pour cela on va utiliser un ping. On le fait sur l’adresse 192.168.1.1 qui correspond (généralement) à la passerelle par défaut","3. Puis la commande arp –a affiche le contenu de la table ARP locale à votre PC, et celle-ci devrait contenir l’adresse MAC de votre passerelle par défaut, ceci est lié au fait que vous avez en premier un ping sur l’adresse 192.168.1.1","4. Vous pouvez identifier les types d’informations affichées (@IP, @MAC, type d’adresses (statique ou dynamique)","● Rôle en cybersécurité : La table ARP révèle les voisins d'un poste : un attaquant qui prend un poste s'en sert pour cartographier le réseau."]}},{"id":"G101","slide":204,"so":203,"titre":"Les 3A","chap":"Annuaires et authentification","qs":["Q065","Q066"],"rap":{"t":"Filtrage par annuaire, les 3A (suite)","p":["Ce que je suis : Empreinte digitale, reconnaissance faciale (biométrie).","2. Autorisation (Qu'as-tu le droit de faire ?)","Une fois l'identité prouvée, le système définit les privilèges. Être authentifié ne signifie pas avoir accès à tout.","Le principe : Le système consulte une liste de droits (ACL ou politiques de groupe) liée à l'identité.","3. Accounting / Traçabilité (Qu'as-tu fait ?)","C'est la partie souvent oubliée, mais vitale pour l'audit et la détection d'intrusions. On enregistre l'activité de l'utilisateur.","● Rôle en cybersécurité : La biométrie est un identifiant, pas un secret : on la protège comme un mot de passe qu'on ne peut pas réinitialiser."]}},{"id":"GC062","slide":209,"so":208,"titre":"Filtrage par annuaire, LDAP","chap":"Annuaires et authentification","qs":["Q067"],"rap":{"t":"Filtrage par annuaire, LDAP","p":["En clair :  LDAP est le langage standard pour interroger l’annuaire de l’entreprise : qui est qui, dans quel service, dans quels groupes.","Qu'est-ce que LDAP ?","C'est un protocole de la couche Application (Niveau 7) qui permet de consulter et de modifier des informations dans un service d'annuaire.","L’analogie : Si l’annuaire (Active Directory, OpenLDAP) est un livre, LDAP est la langue (la grammaire et le vocabulaire) utilisée pour lire les pages de ce livre.","Optimisation : Contrairement à une base de données SQL classique conçue pour l'écriture, LDAP est optimisé pour la lecture rapide et la recherche de gros volumes de données.","● Rôle en cybersécurité : LDAP est le protocole le plus attaqué d'un annuaire : mal protégé, il livre la liste des comptes."]}},{"id":"G104","slide":212,"so":211,"titre":"LDAP","chap":"Annuaires et authentification","qs":["Q068","Q069"],"rap":{"t":"Filtrage par annuaire, LDAP","p":["La structure de l'information : L'Arborescence (DIT)","Dans LDAP, les données ne sont pas dans des tableaux, mais dans un arbre appelé DIT (Directory Information Tree). Chaque \"nœud\" de l'arbre est une entrée.","Le Distinguished Name (DN) : L'adresse unique","Pour identifier une personne précisément, on utilise son DN. C'est le chemin complet pour arriver à l'objet. Exemple pour un utilisateur \"Jean Dupont\" dans le service \"Compta\" de l'entreprise \"MaSociete.fr\" :","cn=Jean Dupont, ou=Compta, dc=MaSociete, dc=fr","CN (Common Name) : Le nom de l'objet (Jean Dupont).","OU (Organizational Unit) : Le dossier ou département (Compta).","DC (Domain Component) : Les parties du nom de domaine (MaSociete . fr).","● Rôle en cybersécurité : Une base de recherche trop haute dans l'arbre donne à une application la visibilité sur toute l'entreprise."]}},{"id":"G108","slide":224,"so":223,"titre":"Lire un annuaire LDAP","chap":"Annuaires et authentification","qs":["Q070","Q071","Q072"],"rap":{"t":"Quand le filtre est construit avec une saisie","p":["L’application colle la saisie dans un modèle","Pour lister les comptes d’un service, l’application utilise un modèle et remplace SAISIE par ce que tape l’utilisateur.","Injection LDAP : si la saisie contient des caractères de filtre, par exemple une parenthèse fermante, l’attaquant change la structure du filtre, pas seulement sa valeur.","Deux règles à connaître : (&) est un ET sans aucune condition, il est toujours vrai ; (|) est un OU sans condition, il est toujours faux.","▲ Beaucoup de serveurs ignorent ce qui suit un filtre complet, mais le comportement varie selon le serveur : il faut le tester sur celui de l’entreprise.","Parades : échapper les caractères ( ) * \\ dans toute saisie ; vérifier un mot de passe par un bind, pas par un filtre.","Modèle de l’application :","(&(uid=SAISIE)(ou=Compta))","Saisie normale : dupont"]}},{"id":"GC068","slide":232,"so":231,"titre":"Filtrage par annuaire AD","chap":"Annuaires et authentification","qs":["Q073"],"rap":{"t":"Filtrage par annuaire, comparaison","p":["Filtrage MAC","Utilise les adresses MAC des appareils pour contrôler l'accès ; moins flexible et plus difficile à gérer dans les grandes organisations.","ACL","Utilisent des listes de contrôle d'accès pour définir les permissions ; peuvent devenir complexes à gérer dans les systèmes étendus.","Annuaire","Particulièrement utile là où la gestion centralisée des identités et des accès est essentielle pour la sécurité et l'efficacité du réseau."]}},{"id":"G116","slide":238,"so":237,"titre":"Structure d’Active Directory","chap":"Active Directory","qs":["Q074","Q075"],"rap":{"t":"Filtrage par annuaire AD","p":["Le Domaine :","Le domaine est l'unité de base d'un réseau AD. Il possède sa propre base de données d'annuaire.","Contrôleur de Domaine (DC) : Le serveur qui héberge l'annuaire.","SID (Security Identifier) : Chaque domaine possède un identifiant unique. Toutes les identités du domaine partagent une partie de ce SID. (détails pages suivantes)","Réplication : Les données sont répliquées entre tous les contrôleurs de domaine d'un même domaine pour garantir la disponibilité.","● Rôle en cybersécurité : La compromission d'un contrôleur de domaine donne tous les hashs de mots de passe de l'entreprise."]}},{"id":"G117","slide":247,"so":245,"titre":"Groupes AD : la chaîne AGDLP","chap":"Active Directory","qs":["Q076","Q077","Q078"],"rap":{"t":"Groupes AD : la chaîne AGDLP","p":["Individuel · 15 min · modèle de droits · hors application · rien à saisir dans LAN Live","Situation","Dossier partagé « Litiges clients » sur le serveur de fichiers (192.168.20.20).","15 gestionnaires : lecture et écriture.","2 responsables : lecture seule.","1 stagiaire arrive lundi pour 3 mois : lecture seule.","À faire","Nommez les groupes globaux (rôles) et les groupes de domaine local (permissions).","Dessinez la chaîne AGDLP complète."]}},{"id":"G127","slide":257,"so":255,"titre":"SID","chap":"Active Directory","qs":["Q079"],"rap":{"t":"Lire un SID","p":["Énoncé","Soit le SID S-1-5-21-3623811015-3361044348-30300820-1013.","Quelle partie est le RID ? Que désigne-t-elle ? Que savez-vous d’un compte dont le RID vaut 500 ?","Votre réponse","● Rôle en cybersécurité : Un attaquant repère le compte administrateur grâce au RID 500, même renommé : renommer le compte ne suffit pas."]}},{"id":"G128","slide":265,"so":264,"titre":"Forêts et relations de confiance","chap":"Active Directory","qs":["Q080"],"rap":{"t":"Filtrage par annuaire AD","p":["Les Relations de Confiance (Trusts)","Pour que l'utilisateur du Domaine A puisse accéder à un fichier dans le Domaine B, il faut une relation de confiance.","Transitivité : Si A fait confiance à B, et B fait confiance à C, alors A fait confiance à C.","Approbations de forêt : Permet de lier deux entreprises distinctes tout en gardant des annuaires séparés.","● Rôle en cybersécurité : Une confiance mal maîtrisée donne à un domaine moins sûr l'accès aux ressources d'un domaine plus sensible."]}},{"id":"G124","slide":268,"so":267,"titre":"Lire un journal de sécurité Windows","chap":"Active Directory","qs":["Q081","Q082","Q083"],"rap":{"t":"Lire un journal de sécurité Windows","p":["Cours avant les questions","Codes d’événements à connaître","4624 ouverture de session réussie","4625 échec d’ouverture de session","4740 compte verrouillé","Signaux d’alerte","Série d’échecs rapprochés depuis une même adresse : attaque par force brute.","Échecs puis réussite sur le même compte : compromission probable.","Bonne pratique"]}},{"id":"G131","slide":274,"so":267,"titre":"Questions : Active Directory","chap":"Active Directory","qs":["Q084","Q085","Q086"],"rap":{"t":"Lire un journal de sécurité Windows","p":["Cours avant les questions","Codes d’événements à connaître","4624 ouverture de session réussie","4625 échec d’ouverture de session","4740 compte verrouillé","Signaux d’alerte","Série d’échecs rapprochés depuis une même adresse : attaque par force brute.","Échecs puis réussite sur le même compte : compromission probable.","Bonne pratique"]}},{"id":"G138","slide":284,"so":283,"titre":"GPO : qui l’emporte ?","chap":"Active Directory","qs":["Q087","Q088","Q089"],"rap":{"t":"Filtrage par annuaire AD (suite)","p":["OU (Unité Organisationnelle) : Votre manager passe et peint par-dessus en Rouge (réglage spécifique à votre métier).","Quelle est la couleur finale ? Le Rouge. Pourquoi ? Parce que c'est la dernière couche appliquée. En informatique, le dernier mot (la couche la plus spécifique) l'emporte sur les couches générales.","RAPPEL LSDOU = c’est l’ordre dans lequel sont appliquées les GPO","● Rôle en cybersécurité : Une GPO d'OU peut défaire une protection du domaine, sauf si celle-ci est « Appliquée »."]}},{"id":"G144","slide":298,"so":297,"titre":"Questions : 802.1X, les bases","chap":"802.1X, RADIUS, Kerberos","qs":["Q090","Q091","Q092"],"rap":{"t":"Protocole 802.1x","p":["Il est supporté par de très nombreux équipements et systèmes.","Équipements réseau","Commutateurs réseau","Points d’accès sans fil","Routeurs","Systèmes d’exploitation","Windows","macOS et iOS","Linux"]}},{"id":"G148","slide":307,"so":305,"titre":"802.1X : qui parle à qui ?","chap":"802.1X, RADIUS, Kerberos","qs":["Q093","Q094"],"rap":{"t":"802.1X : qui parle à qui ?","p":["Individuel · 12 min · rôles et protocoles · hors application · rien à saisir dans LAN Live","Situation","Une tablette de conducteur se connecte au Wi-Fi de l'entrepôt.","Bornes Wi-Fi : 12.","Serveur RADIUS : 192.168.20.5 (avec l'annuaire AD).","Objectif : seules les tablettes autorisées entrent.","À faire","Donnez le rôle de la tablette, de la borne et du serveur.","Quels protocoles entre tablette et borne ? Entre borne et serveur ?"]}},{"id":"G153","slide":316,"so":315,"titre":"EAP : les méthodes","chap":"802.1X, RADIUS, Kerberos","qs":["Q095","Q096"],"rap":{"t":"EAP, les méthodes EAP","p":["EAP-TLS (Transport Layer Security) : Utilise des certificats pour une authentification mutuelle (deux certificats un de chaque côté). C'est l'une des méthodes les plus sécurisées et est souvent utilisée dans les environnements WPA3-Enterprise","EAP-TTLS (Tunneled Transport Layer Security) : Encapsule une session TLS qui effectue une authentification mutuelle en utilisant un autre mécanisme d'authentification interne, comme PAP ou EAP-MSCHAPv2. Un seul certificat qui se trouve coté serveur","EAP-SIM (Subscriber Identity Module) : Utilisé pour l'authentification des abonnés mobiles, en particulier dans les réseaux GSM (2éme génération)","EAP-AKA (Authentication and Key Agreement) : Utilisé pour l'authentification des abonnés dans les réseaux UMTS(3G) et LTE(4G)","● Rôle en cybersécurité : EAP-TLS supprime le mot de passe : plus rien à voler ni à deviner."]}},{"id":"G154","slide":322,"so":320,"titre":"Choisir une méthode EAP","chap":"802.1X, RADIUS, Kerberos","qs":["Q097","Q098"],"rap":{"t":"Choisir une méthode EAP","p":["Individuel · 12 min · arbitrage · hors application · rien à saisir dans LAN Live","Situation","60 tablettes gérées par un MDM (gestion de flotte).","Une PKI interne pourrait délivrer des certificats.","16 PC portables du siège, comptes AD, sans certificat.","Budget de 20 k€.","À faire","Pour chaque population, proposez une méthode EAP.","Justifiez avec 3 critères : sécurité, coût, exploitation."]}},{"id":"G158","slide":328,"so":327,"titre":"RADIUS","chap":"802.1X, RADIUS, Kerberos","qs":["Q099","Q100"],"rap":{"t":"RADIUS","p":["RADIUS repose principalement :","sur un serveur (le serveur RADIUS),relié à une base d’identification (base de données, annuaire LDAP, etc.),","sur un client RADIUS, appelé NAS (Network Access Server),faisant office d’intermédiaire entre l’utilisateur final et le serveur.","L’ensemble des transactions entre le client RADIUS et le serveur RADIUS est chiffré.","Le serveur RADIUS peut faire office de proxy, c’est-à-dire transmettre les requêtes du client à d’autres serveurs RADIUS.","Le serveur traite les demandes d’authentification en accédant si nécessaire à une base externe : base de données SQL, annuaire","LDAP, comptes d’utilisateur de machine ou de domaine.","Un serveur RADIUS dispose pour cela d’un certain nombre d’interfaces ou de méthodes.","● Rôle en cybersécurité : Le secret partagé entre le NAS et le serveur RADIUS est une donnée sensible : on le change et on le stocke avec soin. Il ne protège que le mot de passe de l'utilisateur, pas le reste du paquet : on isole le trafic RADIUS."]}},{"id":"G159","slide":332,"so":327,"titre":"Lire un journal RADIUS","chap":"802.1X, RADIUS, Kerberos","qs":["Q101","Q102","Q103"],"rap":{"t":"RADIUS","p":["RADIUS repose principalement :","sur un serveur (le serveur RADIUS),relié à une base d’identification (base de données, annuaire LDAP, etc.),","sur un client RADIUS, appelé NAS (Network Access Server),faisant office d’intermédiaire entre l’utilisateur final et le serveur.","L’ensemble des transactions entre le client RADIUS et le serveur RADIUS est chiffré.","Le serveur RADIUS peut faire office de proxy, c’est-à-dire transmettre les requêtes du client à d’autres serveurs RADIUS.","Le serveur traite les demandes d’authentification en accédant si nécessaire à une base externe : base de données SQL, annuaire","LDAP, comptes d’utilisateur de machine ou de domaine.","Un serveur RADIUS dispose pour cela d’un certain nombre d’interfaces ou de méthodes.","● Rôle en cybersécurité : Le secret partagé entre le NAS et le serveur RADIUS est une donnée sensible : on le change et on le stocke avec soin. Il ne protège que le mot de passe de l'utilisateur, pas le reste du paquet : on isole le trafic RADIUS."]}},{"id":"G164","slide":342,"so":341,"titre":"Kerberos : l’ordre des échanges","chap":"802.1X, RADIUS, Kerberos","qs":["Q104","Q105","Q106"],"rap":{"t":"Rappel · Kerberos : des tickets horodatés","p":["Rappel avant les questions","Pas de mot de passe sur le réseau","Le mot de passe sert à dériver une clé ; il ne circule pas. Le client reçoit des tickets limités dans le temps.","Les tickets sont horodatés","Kerberos tolère 5 minutes d’écart d’horloge par défaut.","Conséquence pratique","Synchroniser l’heure (NTP) des postes et des contrôleurs de domaine : sinon l’authentification échoue."]}},{"id":"G170","slide":354,"so":353,"titre":"CHAP, PAP et TACACS+","chap":"802.1X, RADIUS, Kerberos","qs":["Q107","Q108"],"rap":{"t":"TACACS+","p":["Protocole d'authentification, d'autorisation et de comptabilité (AAA), souvent utilisé dans les environnements Cisco.","Enjeu","Ces protocoles jouent un rôle crucial dans la sécurisation des systèmes informatiques et la protection des données sensibles. Le choix du protocole dépend des besoins de l'organisation et du niveau de sécurité requis."]}},{"id":"G230","slide":359,"so":358,"titre":"Questions : Protocoles d’authentification","chap":"802.1X, RADIUS, Kerberos","qs":["Q109","Q110","Q111"],"rap":{"t":"Quel protocole pour quel besoin ?","p":["Lisez les six cas, puis répondez aux 3 Questions sur votre PC · LAN Live","Six cas chez TransLor","a. Une session Windows ouverte donne accès aux partages sans retaper le mot de passe.","b. L'appli des conducteurs se connecte « avec le compte Microsoft » sans connaître le mot de passe.","c. Un clic ouvre le logiciel RH en ligne depuis l'annuaire de l'entreprise (SSO fédéré).","d. Un vieux routeur de prestataire prouve son identité par un défi, sans envoyer le mot de passe.","e. Les administrateurs ne tapent que les commandes autorisées sur les switchs, chaque commande est journalisée.","f. Un ancien équipement envoie identifiant et mot de passe en clair.","À faire"]}},{"id":"G171","slide":365,"so":358,"titre":"Quel protocole pour quel besoin ?","chap":"802.1X, RADIUS, Kerberos","qs":["Q112","Q113","Q114"],"rap":{"t":"Quel protocole pour quel besoin ?","p":["Lisez les six cas, puis répondez aux 3 Questions sur votre PC · LAN Live","Six cas chez TransLor","a. Une session Windows ouverte donne accès aux partages sans retaper le mot de passe.","b. L'appli des conducteurs se connecte « avec le compte Microsoft » sans connaître le mot de passe.","c. Un clic ouvre le logiciel RH en ligne depuis l'annuaire de l'entreprise (SSO fédéré).","d. Un vieux routeur de prestataire prouve son identité par un défi, sans envoyer le mot de passe.","e. Les administrateurs ne tapent que les commandes autorisées sur les switchs, chaque commande est journalisée.","f. Un ancien équipement envoie identifiant et mot de passe en clair.","À faire"]}},{"id":"GC107","slide":371,"so":358,"titre":"L’identification","chap":"802.1X, RADIUS, Kerberos","qs":["Q115"],"rap":{"t":"Quel protocole pour quel besoin ?","p":["Lisez les six cas, puis répondez aux 3 Questions sur votre PC · LAN Live","Six cas chez TransLor","a. Une session Windows ouverte donne accès aux partages sans retaper le mot de passe.","b. L'appli des conducteurs se connecte « avec le compte Microsoft » sans connaître le mot de passe.","c. Un clic ouvre le logiciel RH en ligne depuis l'annuaire de l'entreprise (SSO fédéré).","d. Un vieux routeur de prestataire prouve son identité par un défi, sans envoyer le mot de passe.","e. Les administrateurs ne tapent que les commandes autorisées sur les switchs, chaque commande est journalisée.","f. Un ancien équipement envoie identifiant et mot de passe en clair.","À faire"]}},{"id":"GC108","slide":373,"so":358,"titre":"L’authentification","chap":"802.1X, RADIUS, Kerberos","qs":["Q116"],"rap":{"t":"Quel protocole pour quel besoin ?","p":["Lisez les six cas, puis répondez aux 3 Questions sur votre PC · LAN Live","Six cas chez TransLor","a. Une session Windows ouverte donne accès aux partages sans retaper le mot de passe.","b. L'appli des conducteurs se connecte « avec le compte Microsoft » sans connaître le mot de passe.","c. Un clic ouvre le logiciel RH en ligne depuis l'annuaire de l'entreprise (SSO fédéré).","d. Un vieux routeur de prestataire prouve son identité par un défi, sans envoyer le mot de passe.","e. Les administrateurs ne tapent que les commandes autorisées sur les switchs, chaque commande est journalisée.","f. Un ancien équipement envoie identifiant et mot de passe en clair.","À faire"]}},{"id":"G178","slide":379,"so":378,"titre":"Longueur d’un mot de passe","chap":"Mots de passe et MFA","qs":["Q117"],"rap":{"t":"Rappel · Longueur et robustesse d’un mot de passe","p":["Rappel avant les questions","Recommandations","CNIL et ANSSI : au moins 12 caractères mêlant lettres, chiffres et symboles.","La longueur prime","Allonger vaut mieux que compliquer : une phrase de passe longue est plus robuste et plus facile à retenir.","En pratique","Un mot de passe différent par service, avec un gestionnaire de mots de passe."]}},{"id":"G182","slide":386,"so":385,"titre":"Lire une ligne de /etc/shadow","chap":"Mots de passe et MFA","qs":["Q118","Q119","Q120"],"rap":{"t":"Rappel · Une ligne de /etc/shadow","p":["Rappel avant les questions","Format du mot de passe","$id$sel$hash","id : $1 = MD5 · $5 = SHA-256 · $6 = SHA-512. Le sel se trouve entre le 2e et le 3e « $ ».","Un sel par compte","Deux comptes avec le même mot de passe ont des hashs différents : on ne repère pas les doublons, et les tables précalculées sont inutiles.","Champs de vieillissement (après le hash)","dernier_changement : minimum : maximum : avertissement","Durées en jours (le dernier changement est un nombre de jours depuis le 1er janvier 1970)."]}},{"id":"G189","slide":394,"so":393,"titre":"Temps pour casser un mot de passe","chap":"Mots de passe et MFA","qs":["Q121","Q122","Q123"],"rap":{"t":"Authentification La gestion des mots de passe sous LINUX","p":["Que se passe-t-il quand un utilisateur entre son mot de passe sous Linux ?","1 · Saisie","L'utilisateur saisit son mot de passe.","2 · Récupération","Le système lit /etc/passwd et /etc/shadow.","3 · Extraction","Il extrait le sel et le hash stockés.","4 · Combinaison","Il combine le mot de passe saisi avec le sel."]}},{"id":"G196","slide":411,"so":410,"titre":"Questions : sel, poivre et rainbow tables","chap":"Mots de passe et MFA","qs":["Q124","Q125","Q126"],"rap":{"t":"Page 410","p":["Le poivre (pepper) : protéger au-delà du sel","Le poivre complète le sel. Le sel est unique par utilisateur et public (stocké dans la base) ; le poivre est unique pour toute l'application et secret (stocké hors de la base).","Où sont stockés les trois ingrédients ?","Mot de passe","Dans la tête de l'utilisateur.","Sel","Dans la base de données, en clair, à côté du hash.","Poivre","Dans le code de l'application ou une configuration sécurisée du serveur (idéal : coffre-fort de clés HSM ou KMS)."]}},{"id":"G199","slide":418,"so":417,"titre":"Rainbow tables","chap":"Mots de passe et MFA","qs":["Q127","Q128"],"rap":{"t":"Fonctionnement d’une attaque par rainbow table","p":["Une table arc-en-ciel est un ensemble de couples [mot de passe initial P1 ; dernier hash Hn].","Une chaîne compte n mots de passe, n hashs et n−1 fonctions de réduction différentes (R1 à Rn−1).","Usage : l’attaquant a un hash cible et cherche le mot de passe correspondant.","Étape 1 : il suppose que Hcible est le dernier hash Hn et le compare aux fins de chaîne stockées. S’il y a correspondance, le mot de passe est Pn : il repart de P1 et recalcule la chaîne.","Étape 2 : sinon, il suppose que Hcible est Hn−1. Il calcule Pn = Rn−1(Hcible), puis H(Pn), et compare à Hn. S’il y a correspondance, le mot de passe est Pn−1 ; il repart de P1.","Il continue en supposant Hn−2, puis Hn−3, jusqu’à H1. Cela suppose que les fonctions de réduction sont connues : c’est un principe des rainbow tables.","Une chaîne : mots de passe (P), hashs (H) et fonctions de réduction (R)","● H = fonction de hachage · ▲ R = fonction de réduction (différente à chaque étape) · seuls P1 et le dernier hash Hn sont stockés.","P1"]}},{"id":"G202","slide":425,"so":424,"titre":"MFA : un peu de maths","chap":"Mots de passe et MFA","qs":["Q129"],"rap":{"t":"Le MFA","p":["Un peu de maths :","Imaginons que en authentification simple, la probabilité de casser un mot de passe soit 0,001","Si on passe à deux facteurs d’authentification en ajoutant au cas précédent une authentification via SMS dont la probabilité de compromission est indépendante du 1er facteur, et qui vaut aussi 0,001","Question, quelle est alors la probabilité de casser le 2FA ?","1 : 10-6 ?","2 : 0,002 ?","3 : 0,001 ?","● Rôle en cybersécurité : Deux facteurs portés par le même appareil perdent leur indépendance : le vol du téléphone peut tout donner."]}},{"id":"G207","slide":431,"so":430,"titre":"Facteurs d’authentification","chap":"Mots de passe et MFA","qs":["Q130","Q131"],"rap":{"t":"Le MFA – Zoom sur les clés physiques","p":["YubiKey","Titan Security Key"]}},{"id":"G209","slide":438,"so":436,"titre":"Choisir le MFA par population","chap":"Mots de passe et MFA","qs":["Q132","Q133","Q134"],"rap":{"t":"Choisir le MFA par population","p":["Individuel · 15 min · arbitrage · hors application · rien à saisir dans LAN Live","Situation","6 administrateurs : accès aux serveurs et à l'AD.","16 gestionnaires : VPN et messagerie, smartphone personnel.","60 conducteurs : tablette partagée, gants, cabine.","Budget limité, support à 1 personne.","À faire","Choisissez un facteur par population (SMS, application TOTP, notification push, clé FIDO2).","Justifiez : sécurité, coût, ergonomie."]}},{"id":"G213","slide":447,"so":446,"titre":"FIDO2, WebAuthn, CTAP","chap":"Mots de passe et MFA","qs":["Q135","Q136"],"rap":{"t":"MFA = standard et protocole","p":["CTAP gère l’interaction entre le dispositif FIDO2 (ici une clé) et le navigateur","WebAuthn gère l’interaction entre (par exemple) le navigateur et un serveur web. Ceci suppose entre autre l’utilisation d’API"]}},{"id":"G214","slide":452,"so":451,"titre":"Questions : MFA","chap":"Mots de passe et MFA","qs":["Q137","Q138","Q139"],"rap":{"t":"Sujets de TPAE : authentification forte","p":["À faire sous forme de travail dirigé par les étudiants (TPAE)","Livrables : un support PowerPoint ; un exposé oral (minimum 10 minutes) pour lequel il faut maîtriser le contenu ; bonus = une démonstration lorsque le sujet s’y prête.","Pour chaque sujet : le principe, l’enrôlement, la résistance à l’hameçonnage, les limites, un cas d’entreprise.","Quatre sujets au choix","1. FIDO2 et WebAuthn : clés de sécurité, enregistrement et authentification.","2. Passkeys : clés synchronisées qui remplacent le mot de passe, comparées à la clé matérielle.","3. OTP : TOTP et HOTP, les applications d’authentification (RFC 6238 et RFC 4226).","4. Fatigue MFA et SIM swap : attaques sur les notifications push et sur le SMS, contre-mesures.","● Rôle en cybersécurité : Un facteur fort mal choisi ou mal déployé est contourné : l’attaquant vise la procédure de récupération plutôt que le facteur."]}},{"id":"G220","slide":463,"so":461,"titre":"Arrivée, mutation, départ","chap":"Gouvernance des accès","qs":["Q140","Q141","Q142"],"rap":{"t":"Arrivée, mutation, départ","p":["Individuel · 15 min · cycle de vie des accès · hors application · rien à saisir dans LAN Live","Situation","Lundi : un gestionnaire arrive.","Un gestionnaire passe à la comptabilité le 1er du mois.","Un conducteur quitte l'entreprise vendredi.","Un prestataire intervient 3 mois.","À faire","Pour chaque cas : actions sur les comptes et les droits.","Qui valide et dans quel délai ?"]}},{"id":"G225","slide":473,"so":472,"titre":"IAM et IGA","chap":"Gouvernance des accès","qs":["Q143","Q144","Q145"],"rap":{"t":"L’IAM","p":["Identity-as-a-Service (IDaaS) est une solution c       var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];

              bytes.push(b & 0xff);

          }

/* Le PowerPoint pilote : la diapo affichée décide de l'état (question ouverte, close, corrigée) */
function drive(n, tag) {
  if (tag === 'TEST') { G.lastSlide = {n:n || null, gid:null, qid:null, ts:now()}; tfOnSlide(false); return; }
  if (tag === 'TEST:c') { G.lastSlide = {n:n || null, gid:null, qid:null, ts:now()}; tfOnSlide(true); return; }
  let qid = tag && AC.PUB.qs[tag] ? tag : null;
  if (!qid && tag) { const g0 = grpOf(tag); if (g0) qid = g0.qs.find(x => !G.qdone[x]) || g0.qs[0]; }
  if (!qid && n) qid = Object.keys(AC.PUB.qs).find(x => AC.PUB.qs[x].sl === n) || null;
  const c = G.cur, cq = c ? AC.q(c.qid) : null;
  G.lastSlide = {n:n || null, gid:qid ? AC.q(qid).g : null, qid, ts:now()};
  if (qid) {
    if (c && c.qid === qid) { commit(false); return; }
    if (G.qdone[qid]) { ui.note = 'Question ' + AC.num(qid) + ' déjà jouée : elle n’est pas relancée (relance possible en mode secours, onglet Questions).'; commit(false); return; }
    if (c && c.st !== 'rev') reveal();
    const g = grpOf(AC.q(qid).g); ui.note = ''; launch(g.id, g.qs.indexOf(qid)); return;
  }
  if (c && c.st !== 'rev' && n && n > cq.sl) { reveal(); ui.note = 'Diapo ' + n + ' : question ' + AC.num(c.qid) + ' corrigée.'; commit(true); return; }

}
function onSlide(o, m) {

  if (o.k === 'T') { G.slideSeen = now(); ui.note = 'Test du complément PowerPoint reçu : la liaison fonctionne.'; commit(false); return; }   // TesterLANLive

}
function arrive(qid, n) {
  const q = AC.q(qid), g = grpOf(q.g), qi = g.qs.indexOf(qid);
  G.lastSlide = {n:n || q.sl, gid:g.id, qid, ts:now()};
  const where = 'Question ' + AC.num(qid) + ' · diapo ' + q.sl + ' / ' + AC.PUB.total + ' · ' + g.titre;
  if (G.qdone[qid] || (G.cur && G.cur.qid === qid && G.cur.st !== 'rev')) { ui.note = where + ' : déjà jouée (bouton Relancer dans l’onglet Questions).'; commit(false); return; }

  clearTimeout(autoT);
  if (G.auto === 'direct' && !free) {            // la diapo suivante clôt et corrige la question en cours, puis lance la nouvelle après 5 s
    reveal(); ui.note = 'Question précédente corrigée automatiquement ; ' + where + ' démarre dans 5 s.'; commit(true);
    autoT = setTimeout(() => { if (!G.cur || G.cur.st === 'rev') { ui.note = ''; launch(g.id, qi); } }, 5000); return;
  }
  if (G.auto === 'direct' && free) { ui.note = ''; launch(g.id, qi); }
  else if (G.auto === 'manual') { ui.note = where + ' (mode manuel : lancez-la vous-même).'; commit(false); }
  else { G.pend = {gid:g.id, qi}; commit(false); }
}

/* ---------- actions ---------- */
function launch(gid, qi) {

}
function revealCloud(c, q) {
  const ex = SEC.q[c.qid][2] || [], mult = q.final ? 2 : 1, R0 = AC.rankList(G.pl), rk0 = {}; R0.forEach((x, i) => rk0[x.pid] = i + 1);
  c.res = {};

    const P = G.pl[pid], a = c.ans[pid], ws = a ? a.w : [];

}
function reveal() {

  const rep = SEC.q[c.qid][0], q = AC.q(c.qid), mult = q.final ? 2 : 1, R0 = AC.rankList(G.pl), rk0 = {}; R0.forEach((x, i) => rk0[x.pid] = i + 1);
  c.res = {};

    const P = G.pl[pid], a = c.ans[pid];
    if (a && a.a === rep) {

    } else { P.streak = 0; c.res[pid] = [a ? a.a : -1, 0, 0, 0, 0, 0, mult, rk0[pid]]; P.res[c.qid] = {a:a ? a.a : -1, ms:a ? a.ms : null, g:0, ok:0}; }

}
function pilotedInfo() {

  if (!c) return {label:'En attente : mettez le PowerPoint sur une page de question', act:null, ready:false, why:'Piloté par le PowerPoint : la question s’ouvre toute seule quand sa page apparaît.'};

  if (allDone(c)) return {label:'● Question ' + N + ' : toutes les réponses sont reçues (' + answered + ' / ' + nPl() + ')', act:null, ready:true, why:'La page suivante du PowerPoint est la correction : elle ferme la question et corrige.'};
  return {label:'● Question ' + N + ' en cours : ' + answered + ' / ' + nPl() + ' réponses', act:null, ready:false, why:'Piloté par le PowerPoint : la page suivante ferme la question et affiche la correction.'};
}
function stepInfo() {
