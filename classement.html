'use strict';
const AC = {};
AC.DEFAULT_RELAY = 'https://ntfy.sh';
AC.LET = ['A', 'B', 'C', 'D'];
AC.LCOL = ['#3B82F6', '#22C55E', '#F59E0B', '#D946EF'];   // A à D : couleurs de VLAN 10, 20, 30, 40
AC.VLAN = [10, 20, 30, 40];
AC.BASE = 100; AC.SPEED = 50; AC.STREAK = 10; AC.STREAKMAX = 5;
AC.LATE = 0.5; AC.GRACE = 1500;   // réponse tardive (après le chrono) : moitié des points de base, sans bonus ; tolérance de 1,5 s pour le réseau
AC.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
AC.sleep = ms => new Promise(r => setTimeout(r, ms));
AC.rid = n => { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; const b = new Uint8Array(n); crypto.getRandomValues(b); b.forEach(x => s += a[x % a.length]); return s; };
AC.hash = () => { const o = {}; location.hash.replace(/^#/, '').split('&').forEach(p => { const i = p.indexOf('='); if (i > 0) o[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); }); return o; };
AC.fmtT = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
AC.ms = ms => (ms / 1000).toFixed(1).replace('.', ',') + ' s';
AC.q = id => AC.PUB.qs[id];
AC.grp = id => AC.PUB.groups.find(g => g.id === id);
AC.rankList = pl => Object.keys(pl).map(p => Object.assign({pid:p}, pl[p])).sort((a, b) => (b.pts - a.pts) || (a.tt - b.tt) || a.n.localeCompare(b.n, 'fr'));

/* ---------------- Relais (ntfy) : états diffusés en morceaux ---------------- */
AC.CH = 1500; AC.CHW = 50000;
AC.DEFAULT_WS = 'wss://cpro-relay.belmdeveloppement.workers.dev/ps';   // relais Cloudflare (WebSocket, port 443) ; ntfy reste le repli
AC.Relay = function (base, sid, ws) {
  this.base = (base || AC.DEFAULT_RELAY).replace(/\/+$/, '');
  this.tH = 'ac' + sid + 'h'; this.tP = 'ac' + sid + 'p'; this.tS = 'ac' + sid + 's';
  this.room = sid;
  const h = AC.hash(); this.wsBase = h.ws === '0' ? '' : (h.ws || (ws === undefined ? AC.DEFAULT_WS : ws));
  this._subs = {}; this._acks = {}; this._seen = new Set(); this._ws = null; this._wsUp = false; this._fails = 0; this._dead = false;
};
AC.Relay.prototype.useWs = function (topic) { return !!this.wsBase && (topic === this.tH || topic === this.tP); };
AC.Relay.prototype.wsUp = function () { return this._wsUp; };
AC.Relay.prototype._statusAll = function () { Object.keys(this._subs).forEach(t => this._subs[t].upd && this._subs[t].upd()); };
AC.Relay.prototype._wsOpen = function () {
  if (!this.wsBase || this._ws || this._dead) return;
  let w; try { w = new WebSocket(this.wsBase + (this.wsBase.indexOf('?') > 0 ? '&' : '?') + 'room=' + encodeURIComponent(this.room)); }
  catch (e) { this._wsRetry(); return; }
  this._ws = w; let ping = null, closed = false;
  w.onopen = () => {
    this._wsUp = true; this._fails = 0;
    Object.keys(this._subs).forEach(t => { if (this._subs[t].ws) w.send(JSON.stringify({a: 'sub', t, since: this._subs[t].last})); });
    ping = setInterval(() => { try { w.send('ping'); } catch (e) {} }, 25000);
    this._statusAll();
  };
  w.onmessage = e => {
    if (e.data === 'pong') return;
    let m; try { m = JSON.parse(e.data); } catch (x) { return; }
    if (m.a === 'ack') { const k = this._acks[m.u]; if (k) { clearTimeout(k.t); delete this._acks[m.u]; if (m.n === 0 && k.fb) k.fb(); } return; }
    if (m.a !== 'msg') return;
    const s = this._subs[m.t]; if (!s) return;
    s.last = m.id;
    let o; try { o = JSON.parse(m.m); } catch (x) { return; }
    s.cb(o);
  };
  const end = () => {
    if (closed) return; closed = true; clearInterval(ping);
    this._ws = null; this._wsUp = false; this._fails++; this._statusAll(); this._wsRetry();
  };
  w.onclose = end; w.onerror = end;
};
AC.Relay.prototype._wsRetry = function () { if (this._dead) return; setTimeout(() => this._wsOpen(), Math.min(15000, 1000 * Math.pow(2, Math.min(this._fails, 4)))); };
AC.Relay.prototype._wsSend = function (o) { try { this._ws.send(JSON.stringify(o)); return true; } catch (e) { return false; } };
AC.Relay.prototype._ntfy = async function (topic, body) {
  for (let i = 0; i < 5; i++) {
    try { const r = await fetch(this.base + '/' + topic, {method: 'POST', body}); if (r.ok) return true; if (r.status === 429) await AC.sleep(4000); }
    catch (e) { /* réseau */ }
    await AC.sleep(500 * (i + 1));
  }
  return false;
};
/* post : par WebSocket si disponible (avec repli sur ntfy si personne n'écoute ou pas d'accusé), sinon par ntfy */
AC.Relay.prototype.post = async function (topic, obj) {
  obj = Object.assign({_u: AC.rid(10)}, obj);
  const body = JSON.stringify(obj);
  if (this.useWs(topic) && this._wsUp) {
    const fb = () => this._ntfy(topic, body);
    const t = setTimeout(() => { delete this._acks[obj._u]; fb(); }, 2500);
    this._acks[obj._u] = {t, fb};
    if (this._wsSend({a: 'pub', t: topic, m: body, u: obj._u})) return true;
    clearTimeout(t); delete this._acks[obj._u];
  }
  return this._ntfy(topic, body);
};
AC.Relay.prototype.sub = function (topic, since, onmsg, onstatus) {
  let last = since, es = null, dead = false, esOk = false;
  const seen = this._seen;
  const deliver = (o, m) => {
    if (o && o._u) { if (seen.has(o._u)) return; seen.add(o._u); if (seen.size > 20000) seen.clear(); }
    onmsg(o, m);
  };
  const upd = () => onstatus && onstatus(esOk || this._wsUp ? 'ok' : 'retry');
  const open = () => {
    if (dead) return;
    es = new EventSource(this.base + '/' + topic + '/sse?since=' + encodeURIComponent(last));
    es.onopen = () => { esOk = true; upd(); };
    es.onerror = () => { esOk = false; upd(); try { es.close(); } catch (e) {} setTimeout(open, this._wsUp ? 15000 : 2500); };
    es.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.event && m.event !== 'message') return;
      if (m.id) last = m.id;
      let o; try { o = JSON.parse(m.message); } catch (x) { return; }
      deliver(o, m);
    };
  };
  open();
  if (this.useWs(topic)) {
    this._subs[topic] = {last: 0, cb: o => deliver(o), ws: true, upd};
    if (this._wsUp) this._wsSend({a: 'sub', t: topic, since: 0}); else this._wsOpen();
  }
  return () => { dead = true; try { es.close(); } catch (e) {} delete this._subs[topic]; };
};
AC.Relay.prototype.pubState = function (st) {
  const s = JSON.stringify(st), n = Math.ceil(s.length / AC.CH);
  if (this.wsBase && this._wsUp) {     // WebSocket : état complet en un ou quelques gros messages, immédiat
    const k = Math.ceil(s.length / AC.CHW);
    for (let i = 0; i < k; i++) this._wsSend({a: 'pub', t: this.tH, m: JSON.stringify({_u: AC.rid(10), v: st.v, i, n: k, d: s.slice(i * AC.CHW, (i + 1) * AC.CHW)})});
  }
  this._pending = {v: st.v, s, n};
  if (this._busy) return;
  this._busy = true;
  (async () => {
    while (this._pending) {
      const p = this._pending; this._pending = null;
      let ok = true;
      for (let i = 0; i < p.n && ok; i++) ok = await this._ntfy(this.tH, JSON.stringify({_u: AC.rid(10), v: p.v, i, n: p.n, d: p.s.slice(i * AC.CH, (i + 1) * AC.CH)}));
      this.lastOk = ok;
    }
    this._busy = false;
  })();
};
AC.Assembler = function (cb) {
  const parts = {}; let cur = -1;
  return o => {
    if (o == null || o.v == null || o.v < cur) return;
    const key = o.v + '/' + o.n, p = parts[key] || (parts[key] = {n: o.n, a: []});
    p.a[o.i] = o.d;
    let ok = true; for (let i = 0; i < p.n; i++) if (p.a[i] == null) ok = false;
    if (ok && o.v > cur) {
      cur = o.v;
      try { cb(JSON.parse(p.a.join(''))); } catch (e) { console.error(e); }
      Object.keys(parts).forEach(k => { if (parseInt(k, 10) < cur) delete parts[k]; });
    }
  };
};

  aide: {t: 'Aide', h: `<p><b>Comment répondre ?</b></p><ul><li>Lisez l’énoncé en entier, puis repérez le mot qui compte (<i>Pourquoi, Quel, Que se passe-t-il…</i>).</li><li>Si un schéma, une configuration ou un journal est affiché, relisez-le ligne par ligne avant de choisir.</li><li>Éliminez d’abord les propositions que vous savez fausses : il en reste souvent deux.</li><li>Une seule proposition est exacte. Choisissez, puis appuyez sur « Valider ma réponse » : une fois validée, elle ne se change plus.</li><li>Le chrono n’est pas la seule chose qui compte : une bonne réponse vaut des points même si vous êtes un peu plus lent.</li><li>Si vous ne savez pas, regardez la correction : l’explication est faite pour apprendre.</li></ul><p class="muted">L’aide ne donne jamais la réponse ; pour une notion, demandez à l’enseignant.</p>`},
  translor: {t: 'TransLor', h: `<p><b>TransLor</b> est l’entreprise fictive du cours : vous jouez le RSSI chargé de sécuriser ses accès, étape par étape, jusqu’à l’audit final. Les chiffres sont inventés mais réalistes.</p>

  jeu: {t: 'Le jeu', h: `<p><b>LAN Live</b> : une question à la fois, projetée en classe et envoyée sur votre téléphone. Choisissez A, B, C ou D puis validez.</p>
   <h3>Les points</h3><ul>
   <li><b>100 points</b> pour une bonne réponse.</li>
   <li><b>+ jusqu’à 50</b> de bonus de rapidité : plus vous répondez vite, plus il est grand.</li>
   <li><b>+ 10 par bonne réponse consécutive</b> (série), jusqu’à +50.</li>
   <li>La <b>question finale vaut le double</b>.</li>
   <li>Mauvaise réponse ou pas de réponse : 0 point et la série repart de zéro.</li></ul>
   <h3>Temps écoulé</h3><p>Une fois le chrono terminé, vous pouvez <b>encore répondre</b> tant que l’enseignant n’a pas clos la question, mais une bonne réponse tardive ne rapporte que <b>la moitié des points de base (50)</b>, sans bonus de rapidité ni de série. Votre série n’est pas perdue pour autant.</p>
   <h3>Classement</h3><p>Il est individuel. À égalité de points, le <b>temps cumulé le plus court sur les bonnes réponses</b> départage.</p>
   <h3>Bon à savoir</h3><ul><li>Une seule réponse par question : elle ne se modifie plus après validation.</li><li>Si vous êtes déconnecté, rouvrez le même lien : vous retrouvez votre score.</li>
   <li>Un écran de projection peut afficher le classement en salle.</li><li>Choisissez un pseudo sérieux : il est visible de toute la classe.</li></ul>`}

  const c = pub.cur;
  if (!c) return `<div class="card" style="text-align:center"><h1 style="font-size:40px">Rejoignez la séance</h1><div style="width:300px;margin:10px auto;background:#fff;padding:10px;border-radius:12px">${qrSvg(joinUrl(), 280)}</div>
    <p class="mono" style="font-size:20px;color:#29D3FF;word-break:break-all">${AC.esc(joinUrl())}</p><p style="font-size:30px"><b>${pub.np}</b> connecté${pub.np > 1 ? 's' : ''}</p></div>`;
  const q = AC.q(c.qid);
  let h = `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span class="tag" style="font-size:18px">${AC.esc(c.gt)} · ${c.i + 1}/${c.n}</span><span class="tag" style="font-size:18px">diapo ${c.sl} / ${c.tot}</span>${c.fin ? '<span class="pill test" style="font-size:20px">POINTS ×2</span>' : ''}
   ${c.st === 'open' ? `<b class="mono" id="tmr" style="font-size:54px">${c.rem >= 0 ? AC.fmtT(c.rem) : '+' + AC.fmtT(-c.rem) + ' · demi-points'}</b>` : `<span class="tag" style="font-size:18px">${c.st === 'closed' ? 'CLOSE' : 'CORRIGÉE'}</span>`}</div>
   <p style="font-size:30px;margin:.5em 0"><b>${AC.esc(q.txt)}</b></p>${q.ctx ? `<pre class="ctx" style="font-size:19px">${AC.esc(q.ctx)}</pre>` : ''}`;
  const rev = c.st === 'rev' && pub.rev, mx = rev ? Math.max(1, ...pub.rev.cnt) : 1;
  h += q.opts.map((o, i) => `<div class="opt ${rev ? (i === pub.rev.rep ? 'good' : 'dim') : ''}" style="--oc:${AC.LCOL[i]};font-size:24px;cursor:default"><span class="lt">${AC.LET[i]}</span><span style="flex:1">${AC.esc(o)}</span>${rev ? `<span class="bar" style="width:${Math.round(160 * pub.rev.cnt[i] / mx)}px;background:${AC.LCOL[i]}"></span><b class="mono">${pub.rev.cnt[i]}</b>` : ''}</div>`).join('');
  if (c.st !== 'rev') h += `<p style="font-size:24px"><b>${c.done.length}</b> / ${pub.np} réponses reçues</p>`;
  else h += `<p style="font-size:20px;margin:8px 0 0">${AC.esc(pub.rev.exp)}</p>`;
  return h + '</div>';
}
function render() { $('root').innerHTML = `<div class="wrap" style="display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;padding:20px 26px"><div>${left()}</div><div>${board()}${pub && pub.test ? '<span class="pill test">MODE TEST</span>' : ''}</div></div><div class="foot">${AC.FOOT}</div>`; }
render();
</script></body></html>
