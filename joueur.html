AC.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
AC.sleep = ms => new Promise(r => setTimeout(r, ms));
AC.rid = n => { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; const b = new Uint8Array(n); crypto.getRandomValues(b); b.forEach(x => s += a[x % a.length]); return s; };
AC.hash = () => { const o = {}; location.hash.replace(/^#/, '').split('&').forEach(p => { const i = p.indexOf('='); if (i > 0) o[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); }); return o; };
AC.fmtT = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
AC.ms = ms => (ms / 1000).toFixed(1).replace('.', ',') + ' s';

/* ---------------- Relais (ntfy) : états diffusés en morceaux ---------------- */
AC.CH = 1500;
AC.Relay = function (base, sid) {
  this.base = (base || AC.DEFAULT_RELAY).replace(/\/+$/, '');
  this.tH = 'ac' + sid + 'h'; this.tP = 'ac' + sid + 'p'; this.tS = 'ac' + sid + 's';
};
AC.Relay.prototype.post = async function (topic, obj) {
  const body = JSON.stringify(obj);
  for (let i = 0; i < 5; i++) {
    try { const r = await fetch(this.base + '/' + topic, {method:'POST', body}); if (r.ok) return true; if (r.status === 429) await AC.sleep(4000); }
    catch (e) { /* réseau */ }
    await AC.sleep(500 * (i + 1));
  }
  return false;
};
AC.Relay.prototype.sub = function (topic, since, onmsg, onstatus) {
  let last = since, es = null, dead = false;
  const open = () => {
    if (dead) return;
    es = new EventSource(this.base + '/' + topic + '/sse?since=' + encodeURIComponent(last));
    es.onopen = () => onstatus && onstatus('ok');
    es.onerror = () => { onstatus && onstatus('retry'); try { es.close(); } catch (e) {} setTimeout(open, 2500); };
    es.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.event && m.event !== 'message') return;
      if (m.id) last = m.id;
      let o; try { o = JSON.parse(m.message); } catch (x) { return; }
      onmsg(o, m);
    };
  };
  open();
  return () => { dead = true; try { es.close(); } catch (e) {} };
};
AC.Relay.prototype.pubState = function (st) {
  const s = JSON.stringify(st), n = Math.ceil(s.length / AC.CH);
  this._pending = {v: st.v, s, n};
  if (this._busy) return;
  this._busy = true;
  (async () => {
    while (this._pending) {
      const p = this._pending; this._pending = null;
      let ok = true;
      for (let i = 0; i < p.n && ok; i++) ok = await this.post(this.tH, {v: p.v, i, n: p.n, d: p.s.slice(i * AC.CH, (i + 1) * AC.CH)});
      this.lastOk = ok;
    }
    this._busy = false;
  })();
};
AC.Assembler = function (cb) {
  const parts = {}; let cur = -1;
  return o => {
    if (o == null || o.v == null || o.v < cur) return;
    const p = parts[o.v] || (parts[o.v] = {n: o.n, a: []});
    p.a[o.i] = o.d;
    let ok = true; for (let i = 0; i < p.n; i++) if (p.a[i] == null) ok = false;
    if (ok && o.v > cur) {
      cur = o.v;
      try { cb(JSON.parse(p.a.join(''))); } catch (e) { console.error(e); }
      Object.keys(parts).forEach(k => { if (+k < cur) delete parts[k]; });
    }
  };
};

  const r = myRec();
  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #1F3556;background:#0A1326cc">
   <div><b class="mono" style="color:#29D3FF">LAN LIVE</b> ${pub && pub.test ? '<span class="pill test">TEST</span>' : ''}<div class="muted">${AC.esc(me.n || '')}</div></div>
   <div style="text-align:right">${r ? `<div class="mono" style="font-size:1.3em"><b>${r[1]}</b> pts</div><div class="muted">rang ${r[0]} / ${pub.np}</div>` : '<span class="muted">…</span>'}</div></div>`;
}
function lb() {
  if (!pub || !pub.lb || !pub.lb.length) return '';
  const r = myRec(), rows = pub.lb.map((x, i) => `<tr class="${r && r[0] === i + 1 ? 'me' : ''}"><td class="rk">${i + 1}</td><td>${AC.esc(x[0])}</td><td class="muted">${x[3]} ✔</td><td class="pts">${x[1]}</td></tr>`).join('');
  const extra = r && r[0] > pub.lb.length ? `<tr class="me"><td class="rk">${r[0]}</td><td>${AC.esc(me.n)} (vous)</td><td></td><td class="pts">${r[1]}</td></tr>` : '';
  return `<div class="card"><h2>Classement</h2><table class="lb">${rows}${extra}</table></div>`;
}
function qView() {
  const c = pub.cur, q = AC.q(c.qid), k = key(), already = sent[k] !== undefined || c.done.includes(me.pid), choice = sent[k] !== undefined ? sent[k] : draft[k];
  const g = AC.grp(c.gid);
  let h = `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="tag">${AC.esc(c.gt)} · ${c.i + 1}/${c.n}</span><span class="tag">diapo ${c.sl} / ${c.tot}</span>${c.fin ? '<span class="pill test">POINTS ×2</span>' : ''}</div>`;
  if (c.st === 'open') h += `<div style="display:flex;align-items:center;gap:10px;margin:10px 0 2px"><div class="cable" style="flex:1"><div id="cb" style="width:${Math.max(0, 100 * remaining() / c.dur)}%"></div></div><b class="mono" id="tmr" style="min-width:3em;text-align:right">${AC.fmtT(remaining())}</b></div>`;
  h += `<p style="font-size:1.12em;margin:.7em 0"><b>${AC.esc(q.txt)}</b></p>${q.ctx ? `<pre class="ctx">${AC.esc(q.ctx)}</pre>` : ''}`;
  const rev = c.st === 'rev' && pub.rev, rep = rev ? pub.rev.rep : -1, my = rev ? pub.rev.r[me.pid] : null, mine = my ? my[0] : choice;
  h += q.opts.map((o, i) => {
    let cls = 'opt';
    if (rev) { cls += i === rep ? ' good' : (i === mine ? ' bad' : ' dim'); }
    else if (choice === i) cls += ' sel';
    const dis = rev || c.st !== 'open' || already;
    return `<button class="${cls}" style="--oc:${AC.LCOL[i]}" ${dis ? 'disabled' : ''} onclick="pick(${i})"><span class="lt">${AC.LET[i]}</span><span style="flex:1">${AC.esc(o)}</span>${rev && i === rep ? '<b class="ok">✔</b>' : ''}${rev && i === mine && i !== rep ? '<b class="ko">✗</b>' : ''}</button>`;
  }).join('');
  if (c.st === 'open') {
    h += already ? `<p class="ok" style="margin:10px 0 0">✔ Réponse envoyée (${AC.LET[choice] !== undefined ? AC.LET[choice] : ''}). Attendez la correction.</p>`
      : `<p id="lt" class="ko" style="display:${remaining() <= 0 ? 'block' : 'none'};margin:10px 0 0">⏱ Temps écoulé : vous pouvez encore répondre, mais une bonne réponse ne rapporte plus que la moitié des points, sans bonus.</p><button id="vb" class="btn go xl" style="margin-top:8px" ${choice === undefined ? 'disabled' : ''} onclick="valid()">${choice === undefined ? (remaining() <= 0 ? lateLabel(undefined) : 'Choisissez une réponse') : (remaining() <= 0 ? lateLabel(choice) : 'Valider ma réponse : ' + AC.LET[choice])}</button>`;
  } else if (c.st === 'closed') h += `<p class="muted" style="margin:10px 0 0">${already ? '✔ Réponse envoyée.' : '⏱ Temps écoulé : pas de réponse de votre part.'} Correction en attente…</p>`;
  else if (rev) {
    const R = my;
    if (!R) h += `<p class="muted" style="margin-top:10px">Vous n’aviez pas encore rejoint la séance pour cette question.</p>`;
    else {
      const now_ = myRec() ? myRec()[0] : null, mv = R[7] && now_ ? R[7] - now_ : 0;
      h += R[2] ? `<div class="card" style="background:#0a2a1e;border-color:#3DFF9A;margin-top:10px"><b class="ok" style="font-size:1.2em">Bonne réponse ! <span class="gain">+${R[1]} pts</span></b><div class="muted">${R[8] ? `Réponse tardive : ${R[3]} points de base (moitié), sans bonus de rapidité ni de série${R[6] > 1 ? ' → ×' + R[6] : ''}` : `${R[3]} de base + ${R[4]} de rapidité + ${R[5]} de série${R[6] > 1 ? ' → ×' + R[6] : ''}`}</div></div>`
        : `<div class="card" style="background:#2b0e15;border-color:#FF4D6A;margin-top:10px"><b class="ko" style="font-size:1.2em">${R[0] < 0 ? 'Pas de réponse' : 'Mauvaise réponse'} · 0 pt</b><div class="muted">Votre série repart de zéro.</div></div>`;
      if (now_) h += `<p class="muted">Rang ${now_}${mv > 0 ? ' · ▲ +' + mv : mv < 0 ? ' · ▼ ' + mv : ' · ='}</p>`;
    }
    h += `<div class="card" style="margin-top:8px"><h2>Explication</h2><p style="margin:0">${AC.esc(pub.rev.exp)}</p></div>`;
  }
  return h + '</div>';
}
function fxHtml() {
  return `${sheet ? `<div class="sheet"><h2 class="mono" style="color:#29D3FF">${AC.esc(AC.INFO[sheet].t)}</h2>${AC.INFO[sheet].h}<p><button class="btn alt" onclick="sheetTo('${sheet}')">Fermer</button></p></div>` : ''}
   <div class="fxbar"><button class="btn alt ${sheet === 'translor' ? 'on' : ''}" onclick="sheetTo('translor')">🏢 TransLor</button><button class="btn alt ${sheet === 'jeu' ? 'on' : ''}" onclick="sheetTo('jeu')">🎮 Le jeu</button></div>`;
}
function renderFx() { const e = $('fx'); if (e) e.innerHTML = fxHtml(); }
function render() {
  if (sheet) { dirty = true; return; }   // pas de rechargement de l'écran pendant la lecture d'une fiche
  let h;
  if (!me.n) {
    h = `<div class="card" style="margin:16px"><h1 class="mono" style="color:#29D3FF">LAN LIVE</h1><p>Sécurité des accès : ACL, VLAN, annuaires, protocoles.</p><p class="muted">${AC.PORTS(10)}</p>
      <p>Votre pseudo :</p><input id="nm" maxlength="16" style="width:100%;padding:12px;font-size:1.1em;background:#050A14;color:#E8F1FF;border:2px solid #1F3556;border-radius:10px" onkeydown="if(event.key==='Enter')join()" autofocus>
      <p id="err" class="ko"></p><button class="btn go xl" onclick="join()">Se connecter au réseau</button></div>`;
    $('app').innerHTML = h + `<div class="foot" style="padding-bottom:64px">${AC.FOOT}<br><span id="st">${status}</span></div><div id="fx">${fxHtml()}</div>`; return;
  }
  h = topbar();
  if (!pub) h += `<div class="card" style="margin:12px">Connexion à la séance…</div>`;
  else if (!myRec()) h += `<div class="card" style="margin:12px">Inscription en cours…<br><span class="muted">Si cela dure, vérifiez que la séance est bien ouverte par l’enseignant.</span></div>`;
  else if (pub.end) {
    const r = myRec();
    h += `<div style="padding:12px"><div class="card" style="text-align:center"><h1 class="mono">Séance terminée</h1><p style="font-size:1.4em;margin:0">Vous terminez <b class="gain">n° ${r[0]}</b> sur ${pub.np}</p><p class="muted">${r[1]} points</p></div>${lb()}</div>`;
  } else if (pub.cur) h += `<div style="padding:12px">${qView()}${pub.cur.st === 'rev' ? lb() : ''}</div>`;
  else h += `<div style="padding:12px"><div class="card" style="text-align:center"><h2>Connecté</h2><p>${AC.PORTS(12)}</p><p style="font-size:1.15em">En attente de la prochaine question…<br><span class="muted">Regardez l’écran de la salle.</span></p></div>${lb()}</div>`;
  const keep = document.activeElement && document.activeElement.id;
  $('app').innerHTML = h + `<div class="foot" style="padding-bottom:64px">${AC.FOOT}<br><span id="st">${status}</span></div><div id="fx">${fxHtml()}</div>`;
}
render();
</script></body></html>
